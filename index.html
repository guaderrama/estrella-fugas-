<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mural de Luz</title>
    <!-- Código QR para que la gente entre al control desde su celular -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- Tipografía de los mensajes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600&display=swap" rel="stylesheet">
    <style>
        :root { --glass: rgba(14, 12, 28, 0.4); --glass-border: rgba(255, 255, 255, 0.09); --text: rgba(255, 255, 255, 0.82); --muted: rgba(255, 255, 255, 0.46); }
        html, body { height: 100%; }
        body { margin: 0; overflow: hidden; background: radial-gradient(ellipse 80% 70% at 50% 48%, #0e0c26 0%, #06061a 55%, #020208 100%); background-color: #05050f; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; touch-action: none; user-select: none; -webkit-user-select: none; }
        body.idle { cursor: none; }
        canvas { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; display: block; }
        .glass { background: var(--glass); backdrop-filter: blur(16px) saturate(150%); -webkit-backdrop-filter: blur(16px) saturate(150%); border: 1px solid var(--glass-border); box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35); }

        /* Indicador compacto: se desvanece solo cuando nadie mueve el mouse */
        #status { position: fixed; top: 14px; left: 14px; z-index: 10; display: flex; align-items: center; gap: 6px; padding: 5px 10px 5px 8px; border-radius: 999px; color: var(--text); font-size: 11px; transition: opacity 0.6s ease; }
        body.idle #status:not(:hover):not(.error) { opacity: 0.12; }
        #status.hidden { opacity: 0 !important; pointer-events: none; }
        #status .dot { width: 6px; height: 6px; border-radius: 50%; background: #fbbf24; box-shadow: 0 0 6px #fbbf24; }
        #status.ok .dot { background: #34d399; box-shadow: 0 0 6px #34d399; }
        #status.error { color: #fca5a5; }
        #status.error .dot { background: #f87171; box-shadow: 0 0 6px #f87171; }
        #status .sep { opacity: 0.35; }

        /* Tarjeta del QR: pequeña y translúcida */
        #qr-box { position: fixed; right: 14px; bottom: 14px; z-index: 10; display: flex; align-items: center; gap: 10px; padding: 7px 14px 7px 7px; border-radius: 14px; transition: opacity 0.4s ease; }
        #qr-box.hidden { opacity: 0; pointer-events: none; }
        #qr { background: #fff; padding: 5px; border-radius: 8px; line-height: 0; }
        #qr img, #qr canvas { display: block; }
        .qr-text { display: flex; flex-direction: column; gap: 1px; }
        .qr-text strong { font-size: 12px; font-weight: 600; color: var(--text); }
        .qr-text span { font-size: 10.5px; color: var(--muted); }
    </style>
</head>
<body>
    <div id="status" class="glass" title="F: pantalla completa · H: ocultar · Q: ocultar QR · C: cuenta regresiva · P: póster de la noche · M: mar de Los Cabos · N dos veces: nueva noche">
        <i class="dot"></i><span id="netLabel">Conectando</span><span class="sep">·</span><span id="lightsLabel">0 luces</span><span class="sep" id="queueSep" hidden>·</span><span id="queueLabel" hidden></span>
    </div>

    <div id="qr-box" class="glass">
        <div id="qr"></div>
        <div class="qr-text">
            <strong>Deja tu luz</strong>
            <span>Leave your light</span>
        </div>
    </div>

    <canvas id="mural"></canvas>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, doc, onSnapshot, deleteDoc, setDoc, getDoc, getDocs, query, where, orderBy, limit, writeBatch, serverTimestamp, getCountFromServer, setLogLevel } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { firebaseConfig, MESSAGES_COLLECTION, HISTORY_COLLECTION, STATE_DOC, MAX_MESSAGE_CHARS, LIGHT_COLORS, DEFAULT_COLOR, NIGHT_MAX_HOURS } from "./firebase-config.js";

        // --- Ajustes ---
        const HEART_PARTICLES = 1800;
        const MAX_GOLDEN_LIGHTS = 1200;     // Luces doradas que se van quedando en el corazón (tope para no cargar la pantalla)
        const SPARKS_PER_MESSAGE = 700;     // Chispas de cada explosión (el original lanzaba 3,200 y se congelaba)
        const MAX_SPARKS = 3000;            // Tope de chispas en pantalla al mismo tiempo
        const STAR_INTERVAL_MS = 1800;      // Si llegan varios mensajes juntos, las estrellas salen una tras otra
        const CROWD_STAR_INTERVAL_MS = 800; // ...y más seguido cuando hay mucha gente
        const CROWD_START = 3;              // Con esta fila o más, salen 2 mensajes a la vez (más pequeños)
        const CROWD_FULL = 8;               // Con esta fila o más, salen 3 a la vez
        const MAX_QUEUE = 2000;             // Solo protege de alguien que mande miles a propósito; la gente normal nunca llega a este tope
        const BACKLOG_MAX_AGE_MS = 30 * 60 * 1000; // Al abrir la pantalla, salen los mensajes que nadie alcanzó a ver en la última media hora
        const STEP_MS = 1000 / 60;          // La animación avanza en pasos fijos: se ve igual en pantallas de 60 o 120 Hz
        const TEXT_FONT = '"Cormorant Garamond", Georgia, "Times New Roman", serif';
        const SANS_FONT = '-apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif';
        const DEBUG = new URLSearchParams(location.search).has('debug');

        // Si un mensaje llega vacío, se muestra uno de los versículos originales
        const FALLBACK_VERSES = [
            "In Him was life, and that life was the light.",
            "Let your light shine.",
            "Where two or three are gathered, there am I.",
            "Above all, love each other deeply."
        ];

        const clamp = (v, min, max) => Math.min(max, Math.max(min, v));
        const len = (x, y) => Math.sqrt(x * x + y * y); // Mucho más rápido que Math.hypot en las partes que corren miles de veces por segundo
        const rand = (min, max) => min + Math.random() * (max - min);
        const pick = (list) => list[Math.floor(Math.random() * list.length)];
        function setText(el, text) { if (el.textContent !== text) el.textContent = text; }

        // --- Elementos ---
        const canvas = document.getElementById('mural');
        const ctx = canvas.getContext('2d');
        const statusEl = document.getElementById('status');
        const netLabel = document.getElementById('netLabel');
        const lightsLabel = document.getElementById('lightsLabel');
        const queueSep = document.getElementById('queueSep');
        const queueLabel = document.getElementById('queueLabel');
        const qrBox = document.getElementById('qr-box');

        let W = window.innerWidth;
        let H = window.innerHeight;
        let unit = 1;              // Escala general según el tamaño de la pantalla
        let heartScale = 1;
        let CY = 0;                // Altura del centro del corazón (sube un poco cuando está el mar)
        let horizonY = 0;          // Donde empieza el mar
        let caboScene = true;      // El Arco, el mar y las ballenas (tecla M para quitarlos o ponerlos)
        try { caboScene = localStorage.getItem('mural-cabo') !== 'off'; } catch {}
        let steps = 0;
        let lightsReceived = 0;
        let dpr = 1;               // Pixeles reales por pixel de la página (máximo 2)
        let fontEpoch = 0;         // Sube cuando termina de cargar la letra, para volver a acomodar los mensajes

        // ================= Forma del corazón =================
        const heartX = (t) => 16 * Math.pow(Math.sin(t), 3);
        // HEART_SHIFT_Y centra el corazón: la punta baja más de lo que suben los lóbulos (en el original se cortaba la punta)
        const HEART_SHIFT_Y = -2.5;
        const heartY = (t) => -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) + HEART_SHIFT_Y;

        // Cada partícula guarda su lugar en el corazón sin escala, para acomodarse si cambia el tamaño de la ventana
        function homeOf(p) {
            return {
                x: W / 2 + heartX(p.t) * heartScale + p.ox * unit,
                y: CY + heartY(p.t) * heartScale * 1.1 + p.oy * unit
            };
        }

        // ================= Brillos pre-dibujados (mucho más rápido que dibujar círculos con sombra) =================
        function makeGlow(r, g, b, coreAlpha, glowAlpha) {
            const c = document.createElement('canvas');
            c.width = c.height = 64;
            const x = c.getContext('2d');
            const grad = x.createRadialGradient(32, 32, 0, 32, 32, 32);
            grad.addColorStop(0, `rgba(${r}, ${g}, ${b}, ${coreAlpha})`);
            grad.addColorStop(0.32, `rgba(${r}, ${g}, ${b}, ${coreAlpha * 0.9})`);
            grad.addColorStop(0.42, `rgba(${r}, ${g}, ${b}, ${glowAlpha})`);
            grad.addColorStop(1, `rgba(${r}, ${g}, ${b}, 0)`);
            x.fillStyle = grad; x.fillRect(0, 0, 64, 64);
            return c;
        }
        const PARTICLE_GLOWS = [makeGlow(255, 255, 255, 0.85, 0.35), makeGlow(200, 220, 255, 0.85, 0.35), makeGlow(255, 250, 200, 0.85, 0.35)];
        const GOLD_GLOW = makeGlow(255, 223, 120, 1, 0.5);
        const STAR_GLOW = makeGlow(255, 255, 225, 1, 0.55);
        // Cada color de luz que se puede escoger en el celular tiene su brillo (la luz que se queda) y su estrella (más clara)
        const COLOR_GLOWS = Object.fromEntries(Object.entries(LIGHT_COLORS).map(([id, { rgb: [r, g, b] }]) => [id, {
            light: id === 'oro' ? GOLD_GLOW : makeGlow(r, g, b, 1, 0.5),
            star: makeGlow(Math.round((r + 255 * 2) / 3), Math.round((g + 255 * 2) / 3), Math.round((b + 255 * 2) / 3), 1, 0.55),
            // El brillo del texto: el oro conserva el tono original del mural
            text: id === 'oro' ? { fill: '255, 223, 140', glow: '255, 210, 120' } : { fill: `${r}, ${g}, ${b}`, glow: `${r}, ${g}, ${b}` }
        }]));
        // Chispas en colores vivos pero menos saturados que el original (rosa, cian, amarillo, rojo, verde)
        const SPARK_COLORS = ['hsl(320, 75%, 70%)', 'hsl(195, 75%, 64%)', 'hsl(55, 80%, 66%)', 'hsl(355, 72%, 64%)', 'hsl(150, 60%, 60%)'];

        // ================= Cielo =================
        let skyCanvas = null;
        let twinklers = [];
        function buildSky() {
            // Las estrellas fijas se dibujan una sola vez; solo algunas titilan en vivo
            skyCanvas = document.createElement('canvas');
            skyCanvas.width = W; skyCanvas.height = H;
            const s = skyCanvas.getContext('2d');
            for (let i = 0; i < 420; i++) {
                s.fillStyle = `rgba(255, 255, 255, ${rand(0.08, 0.4)})`;
                s.beginPath(); s.arc(rand(0, W), rand(0, H), rand(0.3, 1), 0, Math.PI * 2); s.fill();
            }
            paintMilkyWay(s);
            if (caboScene) {
                const glow = s.createLinearGradient(0, horizonY - H * 0.32, 0, horizonY);
                glow.addColorStop(0, 'rgba(70, 55, 140, 0)'); glow.addColorStop(1, 'rgba(78, 62, 150, 0.32)');
                s.fillStyle = glow; s.fillRect(0, horizonY - H * 0.32, W, H * 0.32);
            }
            twinklers = Array.from({ length: 80 }, () => ({ x: Math.random(), y: Math.random() * (caboScene ? horizonY / H : 1), r: rand(0.5, 1.2), phase: rand(0, Math.PI * 2), speed: rand(0.01, 0.03) }));
        }

        // Vía Láctea: una franja diagonal de nubes de colores suaves (violeta, azul, rosa y turquesa), con su polvo oscuro
        // y miles de estrellitas. Se pinta una sola vez (al abrir o cambiar el tamaño), así que no alenta la animación
        function paintMilkyWay(s) {
            const gauss = () => (Math.random() + Math.random() + Math.random() - 1.5) / 1.5;
            const ax = -0.1 * W, ay = H * 0.92, bx = 1.1 * W, by = H * 0.04;     // De abajo a la izquierda hacia arriba a la derecha
            const bl = len(bx - ax, by - ay); const nx = -(by - ay) / bl, ny = (bx - ax) / bl;
            const band = Math.min(W, H) * 0.13;
            const at = (t, spread) => { const o = gauss() * band * spread; return [ax + (bx - ax) * t + nx * o, ay + (by - ay) * t + ny * o]; };
            const m = Math.min(W, H);
            const colors = ['150, 110, 230', '90, 130, 235', '215, 120, 200', '90, 185, 215', '120, 100, 210', '235, 180, 160'];
            // Nubes de color
            for (let i = 0; i < 520; i++) {
                const t = Math.random(); const [x, y] = at(t, 0.75);
                const r = rand(0.03, 0.09) * m;
                // El centro de la franja (a la mitad) es un poco más cálido y brillante, como el núcleo de la galaxia
                const c = Math.abs(t - 0.55) < 0.12 && Math.random() < 0.35 ? colors[5] : pick(colors.slice(0, 5));
                const g = s.createRadialGradient(x, y, 0, x, y, r);
                g.addColorStop(0, `rgba(${c}, ${rand(0.035, 0.06).toFixed(3)})`); g.addColorStop(1, `rgba(${c}, 0)`);
                s.fillStyle = g; s.fillRect(x - r, y - r, r * 2, r * 2);
            }
            // Polvo oscuro a lo largo del centro, que le da textura
            for (let i = 0; i < 140; i++) {
                const [x, y] = at(Math.random(), 0.25);
                const r = rand(0.015, 0.045) * m;
                const g = s.createRadialGradient(x, y, 0, x, y, r);
                g.addColorStop(0, 'rgba(6, 5, 22, 0.22)'); g.addColorStop(1, 'rgba(6, 5, 22, 0)');
                s.fillStyle = g; s.fillRect(x - r, y - r, r * 2, r * 2);
            }
            // Miles de estrellitas en la franja
            for (let i = 0; i < 2600; i++) {
                const [x, y] = at(Math.random(), 0.6);
                s.fillStyle = `rgba(255, ${Math.round(rand(230, 255))}, ${Math.round(rand(220, 255))}, ${rand(0.12, 0.6).toFixed(2)})`;
                const r = Math.random() < 0.06 ? rand(0.9, 1.5) : rand(0.3, 0.8);
                s.fillRect(x, y, r, r);
            }
        }

        // ================= Partículas del corazón =================
        let particles = [];
        function makeParticle(t, ox, oy, glow) {
            const p = { t, ox, oy, glow, x: rand(0, W), y: rand(0, H), vx: 0, vy: 0, maxSpeed: rand(1, 4), size: rand(1.5, 4), boost: 0, phase: rand(0, Math.PI * 2) };
            return p;
        }
        function createHeart() {
            particles = [];
            for (let i = 0; i < HEART_PARTICLES; i++) {
                const angle = rand(0, Math.PI * 2); const dist = rand(0, 25);
                particles.push(makeParticle(rand(0, Math.PI * 2), Math.cos(angle) * dist, Math.sin(angle) * dist, pick(PARTICLE_GLOWS)));
            }
        }

        function updateParticle(p, beat, time) {
            const home = homeOf(p);
            const tx = W / 2 + (home.x - W / 2) * beat;
            const ty = CY + (home.y - CY) * beat;
            // Buscar su lugar, frenando al llegar
            let dx = tx - p.x; let dy = ty - p.y;
            const d = len(dx, dy) || 1;
            const speed = d < 150 ? (d / 150) * p.maxSpeed : p.maxSpeed;
            let sx = (dx / d) * speed - p.vx; let sy = (dy / d) * speed - p.vy;
            const sm = len(sx, sy);
            if (sm > 0.2) { sx = (sx / sm) * 0.2; sy = (sy / sm) * 0.2; }
            // Un flotar suave, como el ruido del original pero mucho más barato
            const a = (Math.sin(p.x * 0.011 + time * 0.35 + p.phase) + Math.cos(p.y * 0.013 - time * 0.27)) * Math.PI;
            p.vx += sx + Math.cos(a) * 0.15; p.vy += sy + Math.sin(a) * 0.15;
            const v = len(p.vx, p.vy);
            if (v > p.maxSpeed) { p.vx = (p.vx / v) * p.maxSpeed; p.vy = (p.vy / v) * p.maxSpeed; }
            p.x += p.vx; p.y += p.vy;
            if (p.boost > 0) p.boost = Math.max(0, p.boost - 0.03);
        }

        function drawParticle(p, scale) {
            const size = p.size * (1 + p.boost) * scale;
            ctx.drawImage(p.glow, p.x - size / 2, p.y - size / 2, size, size);
        }

        // ================= Estrellas fugaces, pulsos, chispas y luces de cada persona =================
        let shootingStars = [];
        let pulses = [];
        let sparkGroups = SPARK_COLORS.map(() => []);
        let sparkCount = 0;
        let joiners = [];
        let lights = [];           // Las luces que la gente dejó en el corazón (para la constelación)
        let links = [];            // Líneas finas entre luces vecinas: la constelación que crece durante la noche
        let meteors = [];          // Estrellas fugaces de adorno (lluvia de estrellas y alguna suelta de vez en cuando)
        let beatBoost = 0;         // Latido fuerte del corazón al celebrar
        const MAX_LINKS = 2000;
        const FLIGHT_SECONDS = 4;           // Lo que tarda el cometa en llegar al corazón: despacio, para que hasta el distraído lo alcance a ver
        const CROWD_FLIGHT_SECONDS = 2.6;   // Un poco más rápido cuando hay mucha gente, para que la fila siga avanzando
        const flightSteps = () => Math.round((crowd ? CROWD_FLIGHT_SECONDS : FLIGHT_SECONDS) * 1000 / STEP_MS);

        function launchStar(message) {
            // La estrella entra desde cualquier orilla de la pantalla (arriba, abajo o los lados), como en el original
            let x, y;
            if (Math.random() > 0.5) { x = rand(0, W); y = Math.random() > 0.5 ? -30 : H + 30; }
            else { x = Math.random() > 0.5 ? -30 : W + 30; y = rand(0, H); }
            const tx = W / 2; const ty = CY;
            // Viaja en una curva suave, como un cometa, y va frenando al acercarse al corazón
            const dx = tx - x, dy = ty - y; const d = len(dx, dy) || 1;
            const bend = rand(0.12, 0.22) * (Math.random() < 0.5 ? -1 : 1);
            const cx = (x + tx) / 2 - dy * bend, cy = (y + ty) / 2 + dx * bend;
            const size = rand(8, 11) * (0.8 + message.power * 0.5); // Entre más la cargó, más grande llega
            shootingStars.push({ x, y, sx: x, sy: y, cx, cy, tx, ty, age: 0, dur: flightSteps(), size, trail: [], message, glow: COLOR_GLOWS[message.color].star });
        }

        function explode(x, y, message) {
            pulses.push({ x, y, radius: 0, life: 1 });
            // Si ya hay muchas chispas, la siguiente explosión es más pequeña: nunca se traba
            const wanted = SPARKS_PER_MESSAGE * (0.6 + message.power * 0.5);
            const count = Math.round(Math.min(wanted, Math.max(150, MAX_SPARKS - sparkCount)));
            for (let i = 0; i < count; i++) {
                const t = rand(0, Math.PI * 2);
                const r = Math.sqrt(Math.random());
                const hx = r * heartX(t) + Math.cos(i) * rand(0, 3);
                const hy = r * heartY(t) + Math.sin(i) * rand(0, 3);
                const k = rand(0.6, 0.9) * Math.max(0.8, unit);
                const group = Math.floor(Math.random() * sparkGroups.length);
                sparkGroups[group].push({ x, y, vx: hx * k, vy: hy * k, age: 0, life: 255 });
                sparkCount++;
            }
            // Una luz del color de la persona que se va a quedar en el corazón
            const home = particles[Math.floor(Math.random() * Math.min(particles.length, HEART_PARTICLES))];
            joiners.push({ x, y, vx: rand(-2, 2), vy: rand(-2, 2), t: home.t, ox: home.ox, oy: home.oy, glow: COLOR_GLOWS[message.color].light });
        }

        // Agrega una luz al corazón y la une con sus dos vecinas más cercanas
        function addLight(t, ox, oy, glow, x, y) {
            if (lights.length >= MAX_GOLDEN_LIGHTS) return;
            const p = makeParticle(t, ox, oy, glow);
            p.size = 4.4; // Un poco más grande que las luces blancas, para que se note el mosaico de colores de la gente
            if (x !== undefined) { p.x = x; p.y = y; }
            else { const home = homeOf(p); p.x = home.x; p.y = home.y; }
            const home = homeOf(p);
            const maxD2 = Math.pow(Math.min(W, H) * 0.22, 2);
            let best = [null, null]; let bestD = [maxD2, maxD2];
            for (const q of lights) {
                const qh = homeOf(q);
                const d2 = (qh.x - home.x) ** 2 + (qh.y - home.y) ** 2;
                if (d2 < bestD[0]) { best = [q, best[0]]; bestD = [d2, bestD[0]]; }
                else if (d2 < bestD[1]) { best[1] = q; bestD[1] = d2; }
            }
            for (const q of best) if (q && links.length < MAX_LINKS) links.push([p, q]);
            lights.push(p);
            particles.push(p);
        }

        function clearLights() {
            const set = new Set(lights);
            particles = particles.filter(p => !set.has(p));
            lights = []; links = []; joiners = [];
        }

        // ================= Celebraciones =================
        const MILESTONES = [25, 50, 100];
        const isMilestone = (n) => MILESTONES.includes(n) || (n > 100 && n % 100 === 0);
        let banner = null;         // Letrero que aparece unos segundos (metas, nueva noche…): { big, small, age, duration }

        function showBanner(big, small, seconds = 4.5) {
            banner = { big, small, age: 0, duration: Math.round(seconds * 1000 / STEP_MS) };
        }

        function spawnMeteor(delay = 0) {
            // Cruzan el cielo en diagonal, de arriba hacia abajo
            const fromLeft = Math.random() < 0.5;
            const x = fromLeft ? rand(-0.1, 0.5) * W : rand(0.5, 1.1) * W;
            const speed = rand(9, 14) * Math.max(0.8, unit);
            const angle = rand(0.35, 0.6) * Math.PI / 2;
            meteors.push({ x, y: rand(-0.15, 0.25) * H, vx: (fromLeft ? 1 : -1) * Math.cos(angle) * speed, vy: Math.sin(angle) * speed, size: rand(4, 7), trail: [], delay });
        }

        function celebrate(n) {
            beatBoost = 1;
            pulses.push({ x: W / 2, y: CY, radius: 0, life: 1 });
            for (let i = 0; i < 18; i++) spawnMeteor(Math.floor(rand(0, 150)));
            showBanner(`${n} luces esta noche`, `${n} lights tonight`);
        }

        function updateEffects() {
            for (let i = shootingStars.length - 1; i >= 0; i--) {
                const s = shootingStars[i];
                s.trail.push({ x: s.x, y: s.y });
                if (s.trail.length > 46) s.trail.shift(); // Cola larga, para que se note de lejos
                s.age++;
                const t = Math.min(1, s.age / s.dur);
                const e = 1 - Math.pow(1 - t, 1.7);   // Entra con impulso y frena al llegar
                const u = 1 - e;
                s.x = u * u * s.sx + 2 * u * e * s.cx + e * e * s.tx;
                s.y = u * u * s.sy + 2 * u * e * s.cy + e * e * s.ty;
                if (t >= 1) {
                    explode(s.tx, s.ty, s.message);
                    showMessage(s.message);
                    lightsReceived++;
                    updateLightsLabel();
                    if (isMilestone(lightsReceived)) celebrate(lightsReceived);
                    shootingStars.splice(i, 1);
                }
            }
            for (let i = pulses.length - 1; i >= 0; i--) {
                const pulse = pulses[i];
                pulse.radius += 15 * Math.max(0.8, unit);
                pulse.life -= 0.04;
                // Las partículas que toca el anillo brillan y se empujan un poco (se compara al cuadrado para no sacar raíces de más)
                const inner = Math.max(0, pulse.radius - 20); const outer = pulse.radius + 20;
                const inner2 = inner * inner; const outer2 = outer * outer;
                for (const p of particles) {
                    const dx = p.x - pulse.x; const dy = p.y - pulse.y;
                    const d2 = dx * dx + dy * dy;
                    if (d2 > inner2 && d2 < outer2) {
                        const d = Math.sqrt(d2) || 1;
                        p.boost = 1.5;
                        p.vx += (dx / d) * 0.45; p.vy += (dy / d) * 0.45;
                    }
                }
                if (pulse.life <= 0) pulses.splice(i, 1);
            }
            sparkCount = 0;
            for (const group of sparkGroups) {
                let alive = 0;
                for (let i = 0; i < group.length; i++) {
                    const s = group[i];
                    s.age++;
                    if (s.age < 180) { s.vx *= 0.98; s.vy *= 0.98; } else { s.life -= 5; }
                    s.x += s.vx; s.y += s.vy; s.life -= 1;
                    if (s.life > 0) group[alive++] = s;
                }
                group.length = alive;
                sparkCount += alive;
            }
            for (let i = joiners.length - 1; i >= 0; i--) {
                const j = joiners[i];
                const home = homeOf(j);
                const dx = home.x - j.x; const dy = home.y - j.y;
                const d = len(dx, dy) || 1;
                const speed = d < 100 ? (d / 100) * 0.8 : 0.8;
                let sx = (dx / d) * speed - j.vx; let sy = (dy / d) * speed - j.vy;
                const sm = len(sx, sy);
                if (sm > 0.02) { sx = (sx / sm) * 0.02; sy = (sy / sm) * 0.02; }
                j.vx += sx; j.vy += sy;
                const v = len(j.vx, j.vy);
                if (v > 0.8) { j.vx = (j.vx / v) * 0.8; j.vy = (j.vy / v) * 0.8; }
                // Para que no tarde una eternidad en pantallas grandes, se apura un poco cuando está lejos
                j.x += j.vx * Math.max(1, d / 300); j.y += j.vy * Math.max(1, d / 300);
                if (d < 4) {
                    addLight(j.t, j.ox, j.oy, j.glow, j.x, j.y);
                    joiners.splice(i, 1);
                }
            }
            // Lluvia de estrellas (y de vez en cuando una suelta, para que el cielo se sienta vivo)
            if (Math.random() < 1 / (60 * 25)) spawnMeteor();
            for (let i = meteors.length - 1; i >= 0; i--) {
                const m = meteors[i];
                if (m.delay > 0) { m.delay--; continue; }
                m.trail.push({ x: m.x, y: m.y });
                if (m.trail.length > 22) m.trail.shift();
                m.x += m.vx; m.y += m.vy;
                if (m.y > H + 60 || m.x < -120 || m.x > W + 120) meteors.splice(i, 1);
            }
            if (beatBoost > 0) beatBoost = Math.max(0, beatBoost - 0.006);
            if (banner && ++banner.age > banner.duration) banner = null;
        }

        function drawConstellation() {
            if (links.length === 0) return;
            // Todas las líneas en un solo trazo: muy barato aunque haya cientos
            ctx.beginPath();
            for (const [a, b] of links) { ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); }
            ctx.strokeStyle = `rgba(255, 236, 200, ${(0.17 + 0.05 * Math.sin(steps * 0.02)).toFixed(3)})`;
            ctx.lineWidth = Math.max(0.9, unit * 0.8);
            ctx.stroke();
        }

        function drawEffects() {
            const time = steps * STEP_MS;
            // Pulsos
            for (const pulse of pulses) {
                ctx.strokeStyle = `rgba(255, 255, 255, ${clamp(pulse.life, 0, 1)})`; ctx.lineWidth = 3;
                ctx.beginPath(); ctx.arc(pulse.x, pulse.y, pulse.radius, 0, Math.PI * 2); ctx.stroke();
            }
            // Chispas, agrupadas por color
            sparkGroups.forEach((group, i) => {
                ctx.fillStyle = SPARK_COLORS[i];
                for (const s of group) {
                    ctx.globalAlpha = clamp(s.life / 255, 0, 1);
                    ctx.fillRect(s.x - 1.5, s.y - 1.5, 3, 3);
                }
            });
            ctx.globalAlpha = 1;
            // Estrellas fugaces con su cola (la de cada mensaje, en su color) y las de adorno
            for (const s of [...shootingStars, ...meteors]) {
                if (s.delay > 0) continue;
                const glow = s.glow || STAR_GLOW;
                s.trail.forEach((pt, i) => {
                    const f = i / s.trail.length;
                    ctx.globalAlpha = f * 0.6;
                    const size = s.size * f * 2;
                    ctx.drawImage(glow, pt.x - size / 2, pt.y - size / 2, size, size);
                });
                ctx.globalAlpha = 1;
                const size = s.size * 2.6 * (s.message ? 1 + 0.12 * Math.sin(steps * 0.22 + s.size) : 1);
                ctx.drawImage(glow, s.x - size / 2, s.y - size / 2, size, size);
                if (s.message) { const core = size * 0.35; ctx.drawImage(STAR_GLOW, s.x - core / 2, s.y - core / 2, core, core); }
            }
            // Luces viajando a su lugar
            for (const j of joiners) {
                const size = 6 * 2.6 * (1 + 0.15 * Math.sin(time / 200));
                ctx.drawImage(j.glow, j.x - size / 2, j.y - size / 2, size, size);
            }
        }

        // ================= Mensajes =================
        // Ningún mensaje se pierde: todos esperan su turno. Si hay mucha gente, salen 2 o 3 a la vez (más pequeños) en vez de uno por uno.
        const starQueue = [];      // Mensajes esperando su estrella fugaz: { text, ref }
        const textQueue = [];      // Mensajes cuya estrella ya llegó, esperando lugar para leerse
        const shownTexts = [];     // Mensajes que se están leyendo ahora mismo
        const seenIds = new Set(); // Para no repetir un mensaje si la conexión se reinicia
        let lastStarTime = -Infinity;
        let crowd = false;         // Modo "mucha gente"
        // Dónde sale cada mensaje cuando hay varios a la vez (arriba, abajo y al centro), en proporción al tamaño de la pantalla
        const LANES = [-0.2, 0.2, 0];

        // Cualquiera puede escribir en Firestore: se revisa cada dato para que nada raro rompa la pantalla
        const validColor = (c) => typeof c === 'string' && Object.hasOwn(LIGHT_COLORS, c) ? c : DEFAULT_COLOR;
        const isTimestamp = (v) => !!v && typeof v === 'object' && typeof v.toMillis === 'function';
        const INVISIBLE_CHARS = new RegExp('[\\u0000-\\u001f\\u007f\\u200b-\\u200f\\u2028-\\u202e]', 'g');
        function cleanText(value) {
            const raw = typeof value === 'string' ? value : typeof value === 'number' ? String(value) : '';
            const text = raw.slice(0, MAX_MESSAGE_CHARS * 4).replace(INVISIBLE_CHARS, ' ').replace(/\s+/g, ' ').trim();
            return Array.from(text).slice(0, MAX_MESSAGE_CHARS).join(''); // Por letras completas, para no dejar medio emoji al final
        }

        // Cada mensaje trae el color que la persona escogió y qué tanto cargó su estrella (power); todo se valida
        function enqueueMessage(raw, ref = null, extra = {}) {
            if (starQueue.length >= MAX_QUEUE) return false;
            const color = validColor(extra.color);
            const power = typeof extra.power === 'number' && Number.isFinite(extra.power) ? clamp(extra.power, 0.3, 1) : 0.6;
            const createdAt = isTimestamp(extra.createdAt) ? extra.createdAt : null;
            starQueue.push({ text: cleanText(raw) || pick(FALLBACK_VERSES), ref, color, power, createdAt });
            lastActivity = steps;
            return true;
        }

        // ================= Momentos especiales: cuenta regresiva y letreros =================
        // Mientras están en pantalla, los mensajes nuevos esperan su turno (no se pierden)
        let countdown = null;      // { age }
        const COUNTDOWN_STEPS = Math.round(5.5 * 1000 / STEP_MS);
        const overlayActive = () => !!(countdown || banner);
        function startCountdown() { countdown = { age: 0 }; }
        function updateCountdown() { if (countdown && ++countdown.age > COUNTDOWN_STEPS) { countdown = null; lastActivity = steps; } }

        // ================= Modo recuerdo =================
        // Si nadie escribe en un rato, vuelven a aparecer (suaves y más pequeños) mensajes que ya salieron esta noche
        const memories = [];       // { text, color }
        const echoes = [];         // Recuerdos en pantalla
        const ECHO_AFTER_STEPS = Math.round(45 * 1000 / STEP_MS);
        const ECHO_EVERY_STEPS = Math.round(9 * 1000 / STEP_MS);
        let lastActivity = 0; let lastEcho = -Infinity; let lastEchoText = '';
        function remember(message) {
            if (!message.text) return;
            memories.push({ text: message.text, color: message.color });
            if (memories.length > 400) memories.shift();
        }
        function updateEchoes() {
            const busy = waitingCount() > 0 || shownTexts.length > 0 || overlayActive();
            // En cuanto llega alguien, el recuerdo se despide rápido
            if (busy) for (const e of echoes) e.duration = Math.min(e.duration, e.age + 45);
            else if (memories.length && echoes.length === 0 && steps - lastActivity > ECHO_AFTER_STEPS && steps - lastEcho > ECHO_EVERY_STEPS) {
                let m = pick(memories);
                if (memories.length > 1 && m.text === lastEchoText) m = pick(memories);
                lastEchoText = m.text; lastEcho = steps;
                const duration = Math.round(clamp(4 + m.text.length * 0.04, 5, 9) * 1000 / STEP_MS);
                echoes.push({ text: m.text, color: m.color, age: 0, duration, typeSteps: 1, small: true, echo: true, lane: Math.floor(Math.random() * 3) });
            }
            for (let i = echoes.length - 1; i >= 0; i--) if (++echoes[i].age > echoes[i].duration) echoes.splice(i, 1);
        }

        // Mensajes que todavía no salen en pantalla (en fila o con su estrella en camino)
        const waitingCount = () => starQueue.length + shootingStars.length + textQueue.length;

        function updateCrowd() {
            const waiting = starQueue.length + textQueue.length;
            if (!crowd && waiting >= CROWD_START) crowd = true;
            else if (crowd && waiting === 0) crowd = false;
        }

        const lanesAllowed = () => !crowd ? 1 : (starQueue.length + textQueue.length >= CROWD_FULL ? 3 : 2);

        // Cuántos mensajes más caben en pantalla ahora o antes de que llegue el siguiente cometa
        function roomSoon() {
            // (cuenta lo que tarda el cometa en llegar, para que su mensaje salga justo al llegar)
            const busy = shownTexts.filter(m => m.duration - m.age > flightSteps());
            if (!crowd) return busy.length === 0 ? 1 : 0;
            if (busy.some(m => !m.small)) return 0;
            return Math.max(0, lanesAllowed() - busy.length);
        }

        function releaseStars(now) {
            if (starQueue.length === 0 || overlayActive()) return;
            if (now - lastStarTime < (crowd ? CROWD_STAR_INTERVAL_MS : STAR_INTERVAL_MS)) return;
            // Solo sale una estrella si su mensaje va a tener lugar al llegar: así cada mensaje aparece en cuanto llega su luz
            if (shootingStars.length + textQueue.length >= roomSoon()) return;
            launchStar(starQueue.shift());
            lastStarTime = now;
        }

        function showMessage(message) {
            textQueue.push(message);
        }

        function freeLane() {
            for (let i = 0; i < lanesAllowed(); i++) if (!shownTexts.some(m => m.lane === i)) return i;
            return -1;
        }

        function canStartText() {
            if (overlayActive()) return false;
            if (!crowd) return shownTexts.length === 0;
            if (shownTexts.some(m => !m.small)) return false;
            return freeLane() !== -1;
        }

        function startText(message, lane) {
            const small = crowd;
            const chars = message.text.length;
            // Cada mensaje dura según su largo: los largos se alcanzan a leer completos
            const hurry = waitingCount() >= 30 ? 0.85 : 1;
            const seconds = small ? clamp((2 + chars * 0.035) * hurry, 3, 6.5) : clamp(2.5 + chars * 0.05, 4, 9.5);
            const duration = Math.round(seconds * 1000 / STEP_MS);
            // Se escribe letra por letra, pero nunca tarda más de un tercio del tiempo: el resto se lee completo
            const typeSteps = Math.max(1, Math.min((chars + 2) * 3, duration / 3));
            shownTexts.push({ text: message.text, color: message.color, age: 0, duration, typeSteps, small, lane });
            if (message.ref && db) {
                // Ya salió en pantalla: se guarda en el respaldo de la noche y se quita de la fila, las dos cosas juntas.
                // El celular de la persona ve que se quitó de la fila y le avisa que su luz llegó
                const batch = writeBatch(db);
                batch.set(doc(db, HISTORY_COLLECTION, message.ref.id), { text: message.text, color: message.color, power: message.power, createdAt: message.createdAt || serverTimestamp(), shownAt: serverTimestamp() });
                batch.delete(message.ref);
                batch.commit().catch((error) => {
                    // Si el respaldo falla, por lo menos se quita de la fila para que no se repita
                    console.warn('No se pudo guardar en el respaldo:', error);
                    deleteDoc(message.ref).catch(() => {});
                });
            }
            remember(message);
            lastActivity = steps;
        }

        function updateText() {
            updateCrowd();
            // Si de pronto llega mucha gente, el mensaje grande se despide un poco antes para dar paso a los demás
            // (pero nunca antes de que se alcance a leer completo)
            if (crowd) for (const m of shownTexts) {
                if (m.small) continue;
                const readSteps = m.typeSteps + (1 + m.text.length * 0.03) * 60;
                if (m.age > readSteps) m.duration = Math.min(m.duration, m.age + 60);
            }
            while (textQueue.length > 0 && canStartText()) {
                // El lugar se elige antes de sacar el mensaje de la fila: al sacarlo la fila se achica y podrían caber menos
                const lane = crowd ? freeLane() : -1;
                startText(textQueue.shift(), lane);
            }
            for (let i = shownTexts.length - 1; i >= 0; i--) {
                const m = shownTexts[i];
                m.age++;
                if (m.age > m.duration) shownTexts.splice(i, 1);
            }
            // El indicador solo se toca cuando cambia (tocar la página 60 veces por segundo la hace trabajar de más)
            const waiting = waitingCount();
            if (queueLabel.hidden !== (waiting === 0)) queueSep.hidden = queueLabel.hidden = waiting === 0;
            if (waiting > 0) setText(queueLabel, `${waiting} en fila`);
        }

        function wrapLines(text, maxWidth) {
            const lines = []; let line = '';
            for (let word of text.split(' ')) {
                // Una palabra larguísima (como "jajajaja…" o un enlace) se parte para que no se salga de la pantalla
                // (se cuenta por letras completas, para no partir un emoji a la mitad)
                let chars = Array.from(word);
                while (chars.length > 1 && ctx.measureText(word).width > maxWidth) {
                    let cut = chars.length - 1;
                    while (cut > 1 && ctx.measureText(chars.slice(0, cut).join('')).width > maxWidth) cut--;
                    if (line) { lines.push(line); line = ''; }
                    lines.push(chars.slice(0, cut).join(''));
                    chars = chars.slice(cut);
                    word = chars.join('');
                }
                const test = line ? `${line} ${word}` : word;
                if (line && ctx.measureText(test).width > maxWidth) { lines.push(line); line = word; } else { line = test; }
            }
            if (line) lines.push(line);
            return lines;
        }

        function drawText() {
            for (const m of echoes) drawMessage(m);
            for (const m of shownTexts) drawMessage(m);
        }

        // Cada renglón se dibuja UNA sola vez en lienzos escondidos (el brillo dorado y la letra nítida) y en cada cuadro solo se copia:
        // dibujar letras con brillo 60 veces por segundo es de lo más pesado para la computadora, sobre todo con emojis
        function renderLine(line, chars, fontSize, blur, colors) {
            const font = `italic 500 ${fontSize}px ${TEXT_FONT}`;
            ctx.font = font;
            const width = Math.max(1, Math.ceil(ctx.measureText(line).width));
            // Cuánto mide el renglón con 1, 2, 3… letras: así se revela letra por letra sin volver a dibujar
            const prefix = [0];
            for (let k = 1; k <= chars.length; k++) prefix.push(ctx.measureText(chars.slice(0, k).join('')).width);
            const h = Math.ceil(fontSize * 1.6);
            const pad = Math.ceil(blur * 1.5); // Espacio para el brillo alrededor de las letras
            // El brillo es borroso de todos modos: se guarda a resolución normal (pesa 4 veces menos)
            const glow = document.createElement('canvas');
            glow.width = width + pad * 2; glow.height = h + pad * 2;
            const g = glow.getContext('2d');
            g.font = font; g.textBaseline = 'middle';
            g.shadowBlur = blur; g.shadowColor = `rgba(${colors.glow}, 0.9)`;
            g.fillStyle = `rgb(${colors.fill})`;
            g.fillText(line, pad, pad + h / 2);
            // La letra nítida va a la resolución real de la pantalla
            const crisp = document.createElement('canvas');
            crisp.width = Math.ceil((width + 4) * dpr); crisp.height = Math.ceil(h * dpr);
            const c = crisp.getContext('2d');
            c.scale(dpr, dpr);
            c.font = font; c.textBaseline = 'middle';
            c.fillStyle = 'rgb(255, 250, 235)';
            c.fillText(line, 2, h / 2);
            return { glow, crisp, width, prefix, count: chars.length, h, pad };
        }

        function drawMessage(m) {
            // Los recuerdos aparecen y se van más despacio, y más tenues
            const fadeIn = clamp(m.age / (m.echo ? 90 : 30), 0, 1);
            const fadeOut = clamp((m.duration - m.age) / (m.echo ? 90 : 60), 0, 1);
            const alpha = Math.min(fadeIn, fadeOut) * (m.echo ? 0.6 : 1);
            if (alpha <= 0) return;
            // Grande para que se lea en un proyector; más pequeño cuando salen varios a la vez o es un recuerdo
            const fontSize = m.echo ? clamp(W / 60, 18, 40) : m.small ? clamp(W / 52, 20, 46) : clamp(W / 34, 26, 72);
            // Los renglones se preparan una sola vez (y otra vez solo si cambia el tamaño de la pantalla o termina de cargar la letra)
            const layoutKey = `${W}|${dpr}|${fontSize}|${fontEpoch}`;
            if (m.layoutKey !== layoutKey) {
                ctx.font = `italic 500 ${fontSize}px ${TEXT_FONT}`;
                const lines = wrapLines(`“${m.text}”`, W * (m.small ? 0.6 : 0.7));
                const chars = lines.map(line => Array.from(line)); // Letras completas: al escribirse, un emoji nunca sale partido
                // El brillo se mide en pixeles reales, como en el dibujo original
                const blur = (m.small ? 20 : 30) / dpr;
                const colors = (COLOR_GLOWS[m.color] || COLOR_GLOWS[DEFAULT_COLOR]).text;
                m.layout = { lines: lines.map((line, i) => renderLine(line, chars[i], fontSize, blur, colors)), total: chars.reduce((sum, c) => sum + c.length + 1, -1) };
                m.layoutKey = layoutKey;
            }
            const { lines, total } = m.layout;
            const lineHeight = fontSize * 1.2;
            const centerY = CY + (m.small ? LANES[m.lane] * Math.min(W, H) : 0);
            const top = centerY - ((lines.length - 1) * lineHeight) / 2;
            const glowPulse = 0.75 + 0.25 * Math.sin(steps * 0.1);
            let remaining = Math.floor(clamp(m.age / m.typeSteps, 0, 1) * total);
            lines.forEach((L, i) => {
                const k = Math.min(L.count, remaining);
                remaining -= L.count + 1;
                if (k <= 0) return;
                const complete = k >= L.count;
                const w = complete ? L.width : L.prefix[k];
                // Cada renglón empieza siempre en el mismo lugar, así el texto no se recorre mientras aparece
                const x = W / 2 - L.width / 2;
                const y = top + i * lineHeight - L.h / 2;
                const gw = Math.min(L.glow.width, L.pad + w + (complete ? L.pad : 0));
                ctx.globalAlpha = alpha * glowPulse;
                ctx.drawImage(L.glow, 0, 0, gw, L.glow.height, x - L.pad, y - L.pad, gw, L.glow.height);
                const cw = Math.min(L.crisp.width / dpr, w + (complete ? 4 : 2));
                ctx.globalAlpha = alpha * 0.9;
                ctx.drawImage(L.crisp, 0, 0, cw * dpr, L.crisp.height, x - 2, y, cw, L.h);
            });
            ctx.globalAlpha = 1;
        }

        // ================= Firebase =================
        let db = null; let auth = null;

        function setNet(state, text) {
            statusEl.classList.toggle('ok', state === 'ok');
            statusEl.classList.toggle('error', state === 'error');
            setText(netLabel, text);
        }

        async function initializeFirebase(attempt = 1) {
            try {
                if (!db) {
                    const app = initializeApp(firebaseConfig);
                    db = getFirestore(app); auth = getAuth(app);
                    setLogLevel('error');
                }
                await signInAnonymously(auth);
                await setupNight();
                listenMessages();
            } catch (error) {
                // Si la computadora arranca antes que el internet, sigue intentando sola
                console.error("Error al conectar con Firebase (Mural):", error);
                const wait = Math.min(30, 2 ** attempt);
                setNet('error', `Sin conexión, reintentando en ${wait} s…`);
                setTimeout(() => initializeFirebase(attempt + 1), wait * 1000);
            }
        }

        // ================= La noche: cuándo empezó, su respaldo y la cuenta regresiva compartida =================
        let nightStart = null;     // Timestamp de Firestore
        let stateRef = null;
        function updateLightsLabel() { setText(lightsLabel, lightsReceived === 1 ? '1 luz' : `${lightsReceived} luces`); }

        let nightReady = false;
        async function setupNight() {
            if (nightReady) return;
            stateRef = doc(db, ...STATE_DOC);
            // Si no hay noche, o la última empezó hace muchas horas, empieza una nueva sola.
            // Sin internet esto falla a propósito, para que se reintente en vez de arrancar sin noche
            const snap = await getDoc(stateRef);
            const started = snap.exists() ? snap.get('startedAt') : null;
            const tooOld = !isTimestamp(started) || Date.now() - started.toMillis() > NIGHT_MAX_HOURS * 3600 * 1000;
            if (tooOld) await setDoc(stateRef, { startedAt: serverTimestamp() }, { merge: true });
            await listenNight();
            await restoreNight();
            nightReady = true;
            // Si la pantalla se queda prendida días, la noche nueva empieza sola
            setInterval(() => { if (nightStart && Date.now() - nightStart.toMillis() > NIGHT_MAX_HOURS * 3600 * 1000) startNewNight(); }, 10 * 60 * 1000);
        }

        let nightListening = false;
        function listenNight() {
            if (nightListening) return Promise.resolve();
            nightListening = true;
            return new Promise((resolve) => {
                let first = true; let lastCountdown = null; let lastCountdownShown = -Infinity;
                const done = setTimeout(resolve, 5000); // Sin conexión no se espera para siempre
                onSnapshot(stateRef, { includeMetadataChanges: true }, (snap) => {
                    if (snap.metadata.fromCache) return; // Solo cuenta lo que confirma el servidor (sin internet, la copia guardada puede ser vieja)
                    const data = snap.data({ serverTimestamps: 'estimate' }) || {};
                    const started = isTimestamp(data.startedAt) ? data.startedAt : null;
                    // Otra pantalla (o la tecla N) empezó una nueva noche: el corazón se vacía para empezar de cero
                    // (más de un minuto de diferencia: la hora estimada y la del servidor pueden variar unos segundos)
                    if (started && nightStart && started.toMillis() - nightStart.toMillis() > 60 * 1000) {
                        clearLights(); memories.length = 0; echoes.length = 0;
                        lightsReceived = 0; updateLightsLabel();
                        showBanner('Nueva noche', 'A new night begins', 3);
                    }
                    if (started) nightStart = started;
                    // La cuenta regresiva sale al mismo tiempo en todas las pantallas y celulares
                    const cd = isTimestamp(data.countdownAt) ? data.countdownAt.toMillis() : null;
                    // Solo una cuenta reciente y nueva: la pantalla que la lanzó recibe primero la hora estimada y luego la del servidor
                    // (es la misma), y se ignoran cuentas a menos de un minuto de la anterior para que nadie la pueda repetir sin parar
                    const isNew = cd && (lastCountdown === null || Math.abs(cd - lastCountdown) > 30 * 1000);
                    if (isNew && Math.abs(Date.now() - cd) < 15 * 1000 && !countdown && performance.now() - lastCountdownShown > 60 * 1000) {
                        startCountdown(); lastCountdownShown = performance.now();
                    }
                    if (cd) lastCountdown = cd;
                    if (first && started) { first = false; clearTimeout(done); resolve(); }
                    else first = false;
                }, (error) => { console.warn('No se pudo seguir la noche:', error); clearTimeout(done); resolve(); });
            });
        }

        // Al abrir o recargar la pantalla, el corazón recupera todas las luces de esta noche (con sus colores y su constelación)
        async function restoreNight() {
            if (!nightStart) return;
            try {
                const history = collection(db, HISTORY_COLLECTION);
                const [docs, total] = await Promise.all([
                    getDocs(query(history, where('createdAt', '>=', nightStart), orderBy('createdAt', 'asc'), limit(MAX_GOLDEN_LIGHTS))),
                    getCountFromServer(query(history, where('createdAt', '>=', nightStart)))
                ]);
                docs.forEach((d) => {
                    try {
                        const data = d.data() || {};
                        const color = validColor(data.color);
                        const home = particles[Math.floor(Math.random() * HEART_PARTICLES)];
                        addLight(home.t, home.ox, home.oy, COLOR_GLOWS[color].light);
                        remember({ text: cleanText(data.text), color });
                    } catch (error) { console.warn('Luz del respaldo inválida:', error); }
                });
                lightsReceived = Math.max(lightsReceived, total.data().count);
                updateLightsLabel();
            } catch (error) { console.warn('No se pudo recuperar la noche:', error); }
        }

        function startNewNight() {
            if (stateRef) setDoc(stateRef, { startedAt: serverTimestamp() }, { merge: true }).catch((error) => console.warn('No se pudo empezar la noche:', error));
        }
        function triggerCountdown() {
            // Se guarda en Firebase para que salga en todas las pantallas y en los celulares; sin conexión, sale solo aquí
            if (stateRef) setDoc(stateRef, { countdownAt: serverTimestamp() }, { merge: true }).catch(() => startCountdown());
            else startCountdown();
        }

        // Se usa la hora del servidor (la del celular puede estar mal); la del celular solo si falta la otra
        function createdMillis(data) {
            if (isTimestamp(data.createdAt)) { const ms = data.createdAt.toMillis(); if (Number.isFinite(ms)) return ms; }
            return phoneTime(data);
        }
        const phoneTime = (data) => typeof data.t === 'number' && Number.isFinite(data.t) ? data.t : 0;

        function listenMessages() {
            const ref = collection(db, MESSAGES_COLLECTION);
            let gotServerSnapshot = false;
            onSnapshot(ref, { includeMetadataChanges: true }, (snapshot) => {
                if (snapshot.metadata.fromCache) setNet('error', 'Sin conexión');
                else setNet('ok', 'En línea');
                const isFirst = !gotServerSnapshot;
                const now = Date.now();
                snapshot.docChanges()
                    .filter(change => change.type === 'added' && !seenIds.has(change.doc.id))
                    .map(change => ({ id: change.doc.id, ref: change.doc.ref, data: change.doc.data({ serverTimestamps: 'estimate' }) || {} }))
                    // En orden de llegada; si dos llegan en el mismo instante, desempata la hora del celular
                    .sort((a, b) => (createdMillis(a.data) - createdMillis(b.data)) || (phoneTime(a.data) - phoneTime(b.data)))
                    .forEach(({ id, ref: docRef, data }) => {
                        seenIds.add(id);
                        try {
                            // Al abrir la pantalla, los mensajes muy viejos se limpian sin mostrarse
                            if (isFirst && now - createdMillis(data) >= BACKLOG_MAX_AGE_MS) { deleteDoc(docRef).catch(() => {}); return; }
                            // El mensaje se queda en Firebase hasta que sale en pantalla: si la pantalla se recarga, no se pierde
                            enqueueMessage(data.text, docRef, { color: data.color, power: data.power, createdAt: data.createdAt });
                        } catch (error) {
                            // Un mensaje dañado se descarta solo, sin afectar a los demás
                            console.warn('Mensaje inválido descartado:', error);
                            deleteDoc(docRef).catch(() => {});
                        }
                    });
                if (!snapshot.metadata.fromCache) gotServerSnapshot = true;
            }, (error) => {
                console.error("Error escuchando los mensajes:", error);
                setNet('error', 'Error de conexión, reintentando…');
                setTimeout(listenMessages, 5000);
            });
        }

        // ================= Los Cabos: El Arco, el mar y una ballena con su ballenato =================
        // Silueta de El Arco y Los Frailes calcada de una foto real (Land's End al atardecer, Wikimedia Commons).
        // Son coordenadas de la foto: el nivel del mar está en y = 668. El hueco del arco está al final (abre al nivel del agua)
        const ARCO = [[225,668],[240,640],[255,600],[265,560],[272,520],[280,495],[290,487],[300,490],[305,510],[318,520],[330,540],[342,570],[350,600],[360,630],[375,650],
            [383,640],[385,600],[383,550],[385,500],[382,460],[388,420],[398,395],[420,385],[448,372],[468,370],[480,382],[500,400],[520,410],[540,430],[548,445],[560,460],[575,490],[590,520],[605,560],[620,600],[635,630],[650,668],
            [728,668],[745,660],[762,650],[762,620],[765,580],[770,550],[785,530],[790,505],[800,490],[812,480],[825,478],[838,485],[845,500],[848,520],[860,525],[880,520],[900,505],[915,480],[930,460],[950,440],[970,410],[990,380],[1010,345],[1030,315],[1045,295],[1055,282],[1070,278],[1085,285],[1090,300],[1100,290],[1120,265],[1140,248],[1160,243],[1200,250],[1240,265],[1270,280],[1270,668],
            [928,668],[926,640],[918,620],[905,605],[890,598],[872,598],[855,605],[842,620],[835,640],[833,668]];
        const ARCO_X0 = 225, ARCO_W = 1045, ARCO_TOP = 243, ARCO_SEA = 668;
        let arcoSprite = null; let arcoX = 0; let arcoY = 0;
        let seaGradient = null; let arcoReflection = null; let seaH = 0;

        // Todo lo que no se mueve (la silueta y el degradado del mar) se dibuja una sola vez al cambiar el tamaño
        function buildCabo() {
            seaH = H - horizonY;
            // El Arco a la derecha, como se ve desde la bahía; su altura cabe sin tocar el corazón
            const k = Math.min(H * 0.25 / (ARCO_SEA - ARCO_TOP), W * 0.42 / ARCO_W);
            const w = Math.ceil(ARCO_W * k) + 4, h = Math.ceil((ARCO_SEA - ARCO_TOP) * k) + 6;
            arcoSprite = document.createElement('canvas');
            arcoSprite.width = Math.ceil(w * dpr); arcoSprite.height = Math.ceil(h * dpr);
            const a = arcoSprite.getContext('2d');
            a.scale(dpr, dpr);
            a.beginPath();
            ARCO.forEach(([x, y], i) => { const px = 2 + (x - ARCO_X0) * k, py = 2 + (y - ARCO_TOP) * k; i ? a.lineTo(px, py) : a.moveTo(px, py); });
            a.closePath();
            const rock = a.createLinearGradient(0, 0, 0, h);
            rock.addColorStop(0, '#0d0c22'); rock.addColorStop(1, '#04040d');
            a.fillStyle = rock; a.fill();
            // Un borde apenas iluminado, como luz de luna, para que la silueta se lea de noche
            a.lineJoin = 'round';
            a.strokeStyle = 'rgba(150, 150, 210, 0.22)'; a.lineWidth = 1.2; a.stroke();
            arcoX = W - w + 2; arcoY = horizonY - h + 4;
            seaGradient = ctx.createLinearGradient(0, horizonY, 0, H);
            seaGradient.addColorStop(0, '#0c0c2c'); seaGradient.addColorStop(1, '#020210');
            // El reflejo de El Arco: la silueta de cabeza, desvaneciéndose hacia abajo (se prepara una sola vez)
            arcoReflection = document.createElement('canvas');
            arcoReflection.width = arcoSprite.width; arcoReflection.height = arcoSprite.height;
            const r = arcoReflection.getContext('2d');
            r.setTransform(1, 0, 0, -1, 0, arcoReflection.height);
            r.drawImage(arcoSprite, 0, 0);
            r.setTransform(1, 0, 0, 1, 0, 0);
            r.globalCompositeOperation = 'destination-in';
            const fade = r.createLinearGradient(0, 0, 0, Math.min(arcoReflection.height, seaH * dpr));
            fade.addColorStop(0, 'rgba(0, 0, 0, 0.55)'); fade.addColorStop(1, 'rgba(0, 0, 0, 0)');
            r.fillStyle = fade; r.fillRect(0, 0, arcoReflection.width, arcoReflection.height);
        }

        // Ballena jorobada vista de lado (mirando a la derecha): cabeza plana con protuberancias, mandíbula con pliegues,
        // la aleta pectoral larguísima (la seña de las jorobadas), una aleta dorsal pequeña sobre una joroba y la cola horizontal
        const WHALE_BODY = new Path2D('M165,2 C163,-8 150,-16 128,-20 C100,-27 60,-35 15,-36 C-20,-36 -45,-32 -62,-30 C-68,-34 -72,-40 -76,-42 C-80,-36 -86,-30 -96,-26 C-118,-18 -142,-8 -170,-3 L-170,3 C-140,8 -110,20 -70,30 C-30,40 20,44 70,39 C105,35 140,26 158,15 C163,11 166,6 165,2 Z');
        const WHALE_FIN = new Path2D('M84,22 C74,44 44,66 -10,76 C2,66 40,48 66,28 Z');
        const WHALE_FLUKE = new Path2D('M0,0 C-10,-5 -30,-12 -62,-13 C-54,-8 -48,-4 -44,-1 C-50,3 -60,8 -70,14 C-40,12 -16,6 0,0 Z');
        const WHALE_GROOVES = new Path2D('M165,4 C140,9 115,9 92,7 M104,32 C125,28 145,21 158,14 M100,36 C122,33 143,26 160,17 M96,40 C118,38 140,31 156,23');
        const WHALE_KNOBS = [[150, -13], [139, -16], [128, -19], [117, -21]];

        // La mamá nada de un lado a otro; al llegar a la orilla da la vuelta despacio, y su ballenato la sigue
        const whale = { x: -0.1, dir: 1, flip: 1, phase: 0 };
        function updateWhales() {
            if (!caboScene) return;
            whale.phase += 0.045;
            whale.flip += clamp(whale.dir - whale.flip, -0.012, 0.012);
            whale.x += 0.00042 * whale.flip;
            if (whale.x > 1.12 && whale.dir > 0) whale.dir = -1;
            if (whale.x < -0.12 && whale.dir < 0) whale.dir = 1;
        }

        function drawWhale(x, y, size, flip, phase, alpha) {
            ctx.save();
            ctx.translate(x, y);
            ctx.scale(size * flip, size);
            const px = 1 / size;
            ctx.globalAlpha = alpha;
            // Cola: sube y baja al nadar
            ctx.save(); ctx.translate(-168, 0); ctx.rotate(Math.sin(phase) * 0.2);
            ctx.fillStyle = 'rgba(120, 160, 215, 0.2)'; ctx.fill(WHALE_FLUKE);
            ctx.strokeStyle = 'rgba(205, 228, 255, 0.5)'; ctx.lineWidth = 1.3 * px; ctx.stroke(WHALE_FLUKE);
            ctx.restore();
            // Cuerpo, con un halo suave (dos trazos: uno ancho y tenue, otro fino)
            ctx.fillStyle = 'rgba(120, 160, 215, 0.2)'; ctx.fill(WHALE_BODY);
            ctx.strokeStyle = 'rgba(170, 205, 255, 0.07)'; ctx.lineWidth = 7 * px; ctx.stroke(WHALE_BODY);
            ctx.strokeStyle = 'rgba(205, 228, 255, 0.55)'; ctx.lineWidth = 1.4 * px; ctx.stroke(WHALE_BODY);
            ctx.strokeStyle = 'rgba(205, 228, 255, 0.25)'; ctx.lineWidth = 1 * px; ctx.stroke(WHALE_GROOVES);
            // Protuberancias de la cabeza y el ojo
            ctx.fillStyle = 'rgba(225, 240, 255, 0.85)';
            for (const [kx, ky] of WHALE_KNOBS) { ctx.beginPath(); ctx.arc(kx, ky, 1.6, 0, Math.PI * 2); ctx.fill(); }
            ctx.beginPath(); ctx.arc(98, 4, 2.4, 0, Math.PI * 2); ctx.fill();
            // Aleta pectoral blanca y muy larga, con un vaivén lento
            ctx.save(); ctx.translate(84, 22); ctx.rotate(Math.sin(phase * 0.5 + 1) * 0.1); ctx.translate(-84, -22);
            ctx.fillStyle = 'rgba(200, 225, 255, 0.32)'; ctx.fill(WHALE_FIN);
            ctx.strokeStyle = 'rgba(225, 240, 255, 0.65)'; ctx.lineWidth = 1.2 * px; ctx.stroke(WHALE_FIN);
            ctx.restore();
            ctx.restore();
        }

        // El Arco va detrás del corazón
        function drawArco() {
            if (caboScene && arcoSprite && seaParts.arco) ctx.drawImage(arcoSprite, arcoX, arcoY, arcoSprite.width / dpr, arcoSprite.height / dpr);
        }

        // El mar: tapa lo que queda abajo del horizonte, refleja el cielo y el corazón con olas, y ahí nadan las ballenas
        const seaParts = { refl: true, whales: true, waves: true, arco: true }; // Para medir cada parte con ?debug
        function drawSea() {
            if (!caboScene || !arcoReflection) return;
            // 1) El agua (tapa lo que queda abajo del horizonte)
            ctx.fillStyle = seaGradient; ctx.fillRect(0, horizonY, W, seaH);
            if (seaParts.refl) {
                // 2) El reflejo de El Arco en tiras que ondulan con las olas
                const rw = arcoReflection.width / dpr, rh = Math.min(arcoReflection.height / dpr, seaH);
                const slice = 6;
                for (let y = 0; y < rh; y += slice) {
                    const off = Math.sin(steps * 0.035 + y * 0.18) * (1 + y * 0.03);
                    ctx.drawImage(arcoReflection, 0, y * dpr, arcoReflection.width, slice * dpr, arcoX + off, horizonY + y, rw, slice);
                }
                // 3) El reflejo del corazón: solo las luces cercanas al agua, de cabeza y temblando un poco
                const reach = seaH * 0.95;
                const rscale = 2.6 * Math.max(0.8, unit);
                for (const p of particles) {
                    const d = horizonY - p.y;
                    if (d < 0 || d > reach) continue;
                    ctx.globalAlpha = 0.32 * (1 - d / reach);
                    const size = p.size * (1 + p.boost) * rscale;
                    const wob = Math.sin(steps * 0.05 + p.phase + d * 0.08) * (1 + d * 0.04);
                    ctx.drawImage(p.glow, p.x + wob - size / 2, horizonY + d * 0.9 - size / 2, size, size);
                }
                ctx.globalAlpha = 1;
            }
            // 4) La ballena y su ballenato, bajo la superficie
            if (seaParts.whales) {
            const size = seaH / 220;
            const t = whale.phase;
            const wx = whale.x * W, wy = horizonY + seaH * 0.5 + Math.sin(t * 0.13) * seaH * 0.05;
            drawWhale(wx + whale.flip * 64 * size, wy - 36 * size + Math.sin(t * 0.17 + 1) * 4, size * 0.45, whale.flip, t * 1.35 + 1.2, 0.9);
            drawWhale(wx, wy, size, whale.flip, t, 1);
            }
            // 5) Brillos de las olas por encima, para que se sienta que están bajo el agua
            if (seaParts.waves) {
            ctx.lineWidth = 1;
            for (let k = 0; k < 4; k++) {
                const y = horizonY + seaH * (0.14 + k * 0.24);
                ctx.beginPath();
                for (let x = 0; x <= W; x += 28) {
                    const yy = y + Math.sin(x * 0.011 + steps * 0.03 + k * 1.7) * (2 + k);
                    x ? ctx.lineTo(x, yy) : ctx.moveTo(x, yy);
                }
                ctx.strokeStyle = `rgba(180, 190, 255, ${(0.07 - k * 0.008).toFixed(3)})`;
                ctx.stroke();
            }
            }
            ctx.fillStyle = 'rgba(190, 180, 255, 0.14)'; ctx.fillRect(0, horizonY, W, 1);
        }

        // ================= Pantalla =================
        function resize() {
            W = window.innerWidth; H = window.innerHeight;
            dpr = Math.min(2, window.devicePixelRatio || 1);
            canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            unit = clamp(Math.min(W, H) / 800, 0.6, 2.2);
            horizonY = Math.round(H * 0.875);
            if (caboScene) {
                // Con el mar de Los Cabos el corazón cabe completo entre la orilla de arriba y el horizonte, y su punta casi toca el mar.
                // El corazón mide 14.4 unidades hacia arriba y 14.5 hacia abajo (×1.1), más 25 de brillo alrededor de cada luz
                heartScale = Math.min(Math.min(W, H) * 0.028, (horizonY - H * 0.03 - 50 * unit) / (2 * 15.95));
                CY = H * 0.03 + 25 * unit + 15.9 * heartScale;
            } else {
                heartScale = Math.min(W, H) * 0.028;
                CY = H / 2;
            }
            // Las partículas (y las luces doradas acumuladas) se acomodan solas a su nuevo lugar; no se pierde nada
            buildSky();
            if (caboScene) buildCabo();
            needsRender = true;
        }

        async function keepScreenOn() {
            try { if ('wakeLock' in navigator && document.visibilityState === 'visible') await navigator.wakeLock.request('screen'); }
            catch (error) { console.warn('No se pudo evitar que la pantalla se apague:', error); }
        }

        let cursorTimer = null;
        function showCursor() {
            document.body.classList.remove('idle');
            clearTimeout(cursorTimer);
            cursorTimer = setTimeout(() => document.body.classList.add('idle'), 3000);
        }

        function showControllerQR() {
            const url = `${location.origin}/control`;
            const qr = document.getElementById('qr');
            if (typeof QRCode === 'undefined') { qr.textContent = url; return; }
            const size = Math.round(clamp(Math.min(W, H) * 0.075, 64, 110));
            new QRCode(qr, { text: url, width: size * 2, height: size * 2, colorDark: '#06061a', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M });
            qr.querySelectorAll('img, canvas').forEach(el => { el.style.width = `${size}px`; el.style.height = `${size}px`; });
            qr.title = url;
        }

        // ================= Letreros, cuenta regresiva y póster =================
        // Texto grande que se encoge solo si no cabe en la pantalla
        function fitFont(text, size, weight = 500) {
            ctx.font = `italic ${weight} ${size}px ${TEXT_FONT}`;
            const width = ctx.measureText(text).width;
            if (width > W * 0.9) { size = Math.floor(size * (W * 0.9) / width); ctx.font = `italic ${weight} ${size}px ${TEXT_FONT}`; }
            return size;
        }
        function glowText(text, x, y, alpha) {
            ctx.globalAlpha = alpha;
            ctx.shadowColor = 'rgba(255, 210, 120, 0.8)'; ctx.shadowBlur = 36;
            ctx.fillStyle = '#ffe9b8'; ctx.fillText(text, x, y);
            ctx.shadowBlur = 0;
        }

        function drawBanner() {
            if (!banner) return;
            const b = banner;
            const fade = clamp(Math.min(b.age / 30, (b.duration - b.age) / 45), 0, 1);
            ctx.save();
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillStyle = `rgba(3, 3, 14, ${0.35 * fade})`; ctx.fillRect(0, 0, W, H);
            const size = fitFont(b.big, clamp(W / 16, 36, 120));
            glowText(b.big, W / 2, CY - size * 0.2, fade);
            ctx.font = `italic 500 ${clamp(W / 48, 18, 40)}px ${TEXT_FONT}`;
            ctx.fillStyle = 'rgba(245, 241, 230, 0.8)';
            ctx.fillText(b.small, W / 2, CY + size * 0.7);
            ctx.restore();
        }

        function drawCountdown() {
            if (!countdown) return;
            const a = countdown.age; const sec = a * STEP_MS / 1000;
            const veil = clamp(Math.min(a / 20, (COUNTDOWN_STEPS - a) / 30), 0, 1);
            ctx.save();
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillStyle = `rgba(3, 3, 14, ${0.5 * veil})`; ctx.fillRect(0, 0, W, H);
            if (sec < 3) {
                // 3, 2, 1: cada número entra grande y se asienta
                const f = sec % 1;
                const size = Math.round(Math.min(W, H) * 0.32 * (1 + (1 - Math.min(1, f * 3)) * 0.35));
                ctx.font = `italic 500 ${size}px ${TEXT_FONT}`;
                glowText(String(3 - Math.floor(sec)), W / 2, CY - Math.min(W, H) * 0.04, Math.min(1, f * 5) * (f > 0.85 ? (1 - f) / 0.15 : 1));
                ctx.globalAlpha = veil;
                ctx.font = `italic 500 ${clamp(W / 44, 20, 46)}px ${TEXT_FONT}`;
                ctx.fillStyle = 'rgba(245, 241, 230, 0.85)';
                ctx.fillText('Preparen su luz · Get your light ready', W / 2, CY + Math.min(W, H) * 0.25);
            } else {
                const f = (sec - 3) / 2.5;
                const alpha = clamp(Math.min(f * 4, (1 - f) * 3), 0, 1);
                const size = fitFont('¡Lancen sus luces!', clamp(W / 12, 44, 160));
                glowText('¡Lancen sus luces!', W / 2, CY - size * 0.25, alpha);
                ctx.font = `italic 500 ${clamp(W / 40, 20, 50)}px ${TEXT_FONT}`;
                ctx.fillStyle = 'rgba(245, 241, 230, 0.85)';
                ctx.fillText('Send your lights!', W / 2, CY + size * 0.65);
            }
            ctx.restore();
        }

        // Póster de la noche (formato Instagram 4:5): el corazón como está ahora, sin textos encima, y cuántas luces se encendieron
        let posterMode = false;
        function makePoster() {
            posterMode = true;
            try { render(); } finally { posterMode = false; needsRender = true; }
            const S = Math.min(W, H) * 1.16; // Un poco de cielo alrededor para que el corazón quepa completo
            const out = document.createElement('canvas'); out.width = 1080; out.height = 1350;
            const c = out.getContext('2d');
            c.fillStyle = '#05050f'; c.fillRect(0, 0, 1080, 1350);
            c.drawImage(canvas, (W / 2 - S / 2) * dpr, (CY + (caboScene ? H * 0.06 : 0) - S / 2) * dpr, S * dpr, S * dpr, 0, 10, 1080, 1080);
            const fadeBottom = c.createLinearGradient(0, 820, 0, 1350);
            fadeBottom.addColorStop(0, 'rgba(5, 5, 15, 0)'); fadeBottom.addColorStop(0.35, 'rgba(5, 5, 15, 0.92)'); fadeBottom.addColorStop(1, '#05050f');
            c.fillStyle = fadeBottom; c.fillRect(0, 820, 1080, 530);
            c.textAlign = 'center'; c.textBaseline = 'middle';
            c.fillStyle = 'rgba(245, 241, 230, 0.88)'; c.font = `italic 500 46px ${TEXT_FONT}`;
            c.fillText('Esta noche se encendieron', 540, 1030);
            c.shadowColor = 'rgba(255, 210, 120, 0.7)'; c.shadowBlur = 30;
            c.fillStyle = '#ffe9b8'; c.font = `italic 600 124px ${TEXT_FONT}`;
            c.fillText(`${lightsReceived} ${lightsReceived === 1 ? 'luz' : 'luces'}`, 540, 1118);
            c.shadowBlur = 0;
            const date = new Date().toLocaleDateString('es-MX', { day: 'numeric', month: 'long', year: 'numeric' });
            c.fillStyle = 'rgba(245, 241, 230, 0.7)'; c.font = `400 26px ${SANS_FONT}`;
            c.fillText(`${lightsReceived} ${lightsReceived === 1 ? 'light was' : 'lights were'} lit tonight`, 540, 1212);
            c.fillText(`Mural de Luz · Iván Guaderrama Gallery · ${date}`, 540, 1275);
            out.toBlob((blob) => {
                if (!blob) return;
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                const d = new Date(); // Fecha local (no la de Greenwich, que en la noche ya es el día siguiente)
                a.download = `mural-de-luz-${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}.png`;
                document.body.appendChild(a); a.click(); a.remove();
                setTimeout(() => URL.revokeObjectURL(a.href), 4000);
            }, 'image/png');
            showBanner('Póster guardado', 'Poster saved', 2.5);
        }

        // ================= Animación =================
        let lastTime = performance.now();
        let accumulator = 0;
        let frame = 0;
        let animationErrors = 0;
        let needsRender = true;    // Al cambiar el tamaño, el lienzo se borra y hay que volver a dibujar

        function step() {
            steps++;
            const time = steps * STEP_MS / 1000;
            const beat = Math.sin(steps * 0.04) * (0.08 + beatBoost * 0.07) + 1.0; // El corazón respira como en el original (y late fuerte al celebrar)
            releaseStars(steps * STEP_MS);
            for (const p of particles) updateParticle(p, beat, time);
            updateEffects();
            updateText();
            updateEchoes();
            updateCountdown();
            for (const s of twinklers) s.phase += s.speed;
            updateWhales();
        }

        function render() {
            ctx.clearRect(0, 0, W, H);
            if (skyCanvas) ctx.drawImage(skyCanvas, 0, 0, W, H);
            ctx.fillStyle = '#ffffff';
            for (const s of twinklers) {
                ctx.globalAlpha = 0.15 + 0.45 * (0.5 + 0.5 * Math.sin(s.phase));
                ctx.fillRect(s.x * W, s.y * H, s.r * 1.6, s.r * 1.6);
            }
            ctx.globalAlpha = 1;
            const scale = 2.6 * Math.max(0.8, unit);
            drawArco();
            drawConstellation();
            for (const p of particles) drawParticle(p, scale);
            drawEffects();
            drawSea();
            if (posterMode) return;
            drawText();
            drawBanner();
            drawCountdown();
        }

        function animate(now = performance.now()) {
            requestAnimationFrame(animate); // Se agenda primero: un error en un cuadro nunca congela la pantalla
            frame++;
            try {
                accumulator += Math.min(250, now - lastTime);
                lastTime = now;
                let n = 0;
                while (accumulator >= STEP_MS && n < 5) { step(); accumulator -= STEP_MS; n++; }
                if (n === 5) accumulator = 0;
                // En pantallas de 120 Hz la mitad de los cuadros no trae nada nuevo: no se vuelve a dibujar lo mismo
                if (n > 0 || needsRender) { render(); needsRender = false; }
            } catch (error) {
                if (animationErrors++ < 5) console.error("Error en la animación:", error);
            }
        }

        // ================= Eventos e inicio =================
        let lastNewNightKey = 0; let lastCountdownKey = -Infinity;
        window.addEventListener('keydown', (e) => {
            if (e.metaKey || e.ctrlKey || e.altKey) return;
            const key = e.key.toLowerCase();
            if (key === 'f') { if (document.fullscreenElement) document.exitFullscreen().catch(() => {}); else document.documentElement.requestFullscreen().catch(() => {}); }
            if (key === 'h') statusEl.classList.toggle('hidden');
            if (key === 'q') qrBox.classList.toggle('hidden');
            if (key === 'c' && !countdown && performance.now() - lastCountdownKey > 60 * 1000) { lastCountdownKey = performance.now(); triggerCountdown(); }
            if (key === 'p') makePoster();
            if (key === 'm') {
                // Quita o pone El Arco, el mar y las ballenas (se recuerda en esta computadora)
                caboScene = !caboScene;
                try { localStorage.setItem('mural-cabo', caboScene ? 'on' : 'off'); } catch {}
                resize();
            }
            if (key === 'n') {
                // Se pide dos veces para no borrar la noche por accidente
                if (performance.now() - lastNewNightKey < 3000) { lastNewNightKey = 0; startNewNight(); }
                else { lastNewNightKey = performance.now(); showBanner('Presiona N otra vez para empezar una nueva noche', 'Press N again to start a new night', 3); }
            }
        });
        let resizeTimer = null;
        window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(resize, 150); });
        window.addEventListener('pointermove', showCursor);
        document.addEventListener('visibilitychange', keepScreenOn);

        resize();
        createHeart();
        if (document.fonts) document.fonts.load(`italic 500 40px ${TEXT_FONT}`).then(() => { fontEpoch++; warmUpText(); }).catch(() => {});
        // La primera vez que se dibuja un emoji, la computadora tarda en cargar su letra y la animación da un brinquito:
        // se dibujan una vez al inicio, en un lienzo escondido, para que el primer mensaje con 💛 salga suave
        function warmUpText() {
            const c = document.createElement('canvas'); c.width = c.height = 64;
            const x = c.getContext('2d');
            x.font = `italic 500 40px ${TEXT_FONT}`;
            x.shadowBlur = 20; x.shadowColor = 'rgba(255, 210, 120, 0.5)';
            x.fillText('“Aá ñ ü 💛✨🙏🌟❤️😊”', 0, 40);
        }
        warmUpText();
        animate();
        showControllerQR();
        showCursor();
        keepScreenOn();
        initializeFirebase();

        // Herramientas de prueba: abre la página con ?debug
        if (DEBUG) {
            window.muralDebug = {
                enqueueMessage,
                state: () => ({ frame, steps, particles: particles.length, sparks: sparkCount, stars: shootingStars.length, starQueue: starQueue.length, textQueue: textQueue.length, crowd, shown: shownTexts.map(m => ({ text: m.text, small: m.small, lane: m.lane, color: m.color, seconds: +(m.duration * STEP_MS / 1000).toFixed(1) })), lights: lightsReceived, heartLights: lights.length, links: links.length, memories: memories.length, echoes: echoes.map(e => e.text), countdown: !!countdown, banner: banner && banner.big, meteors: meteors.length, nightStart: nightStart && nightStart.toMillis() }),
                celebrate, startCountdown, triggerCountdown, makePoster, seaParts,
                // Mide cuánto tarda en dibujarse un cuadro con y sin el mar (la lectura final obliga a terminar de dibujar)
                bench: (n = 60) => {
                    const time = (cabo) => {
                        const was = caboScene; caboScene = cabo;
                        ctx.getImageData(0, 0, 1, 1);
                        const t0 = performance.now();
                        for (let i = 0; i < n; i++) render();
                        ctx.getImageData(0, 0, 1, 1);
                        caboScene = was;
                        return (performance.now() - t0) / n;
                    };
                    const out = { conMar: [], sinMar: [] };
                    for (let r = 0; r < 3; r++) { out.conMar.push(time(true)); out.sinMar.push(time(false)); }
                    const med = (a) => +a.sort((x, y) => x - y)[1].toFixed(2);
                    return { msPorCuadroConMar: med(out.conMar), msPorCuadroSinMar: med(out.sinMar) };
                },
                idle: () => { lastActivity = -1e9; lastEcho = -1e9; }
            };
        }
    </script>
</body>
