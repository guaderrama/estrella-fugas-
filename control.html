<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#06061a">
    <meta name="color-scheme" content="dark">
    <title>Mural de Luz · Deja tu luz</title>
    <!-- La misma letra elegante de la pantalla grande (también se usa en la imagen de recuerdo) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600&display=swap" rel="stylesheet">
    <style>
        :root {
            --c: 242, 196, 109;                 /* Color de la luz escogida (cambia con los botones de color) */
            --text: #f5f1e6; --muted: #b9b4cc; --faint: #8a85a3;
            --line: rgba(255, 255, 255, 0.12); --glass: rgba(18, 16, 42, 0.62);
            --gold: #f2c46d; --gold-ink: #2a1c00;
            --serif: "Cormorant Garamond", Georgia, "Times New Roman", serif;
            --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        }
        * { box-sizing: border-box; }
        html, body { height: 100%; }
        body { margin: 0; font-family: var(--sans); color: var(--text); background: radial-gradient(ellipse 120% 80% at 50% 30%, #121036 0%, #07071d 55%, #020208 100%); background-color: #05050f; -webkit-tap-highlight-color: transparent; overflow-x: hidden; }
        button { font-family: inherit; }

        /* Cielo estrellado de fondo, igual que la pantalla grande */
        #sky { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
        #sky i { position: absolute; border-radius: 50%; background: #fff; animation: twinkle var(--d) ease-in-out infinite; animation-delay: var(--delay); }
        @keyframes twinkle { 50% { opacity: 0.15; } }

        main { position: relative; z-index: 1; min-height: 100%; min-height: 100dvh; display: flex; justify-content: center; padding: max(20px, env(safe-area-inset-top)) 18px max(20px, env(safe-area-inset-bottom)); }
        .view { width: 100%; max-width: 420px; display: none; flex-direction: column; align-items: center; text-align: center; }
        .view.active { display: flex; animation: appear 0.5s ease both; }
        @keyframes appear { from { opacity: 0; transform: translateY(10px); } }

        h1 { font-family: var(--serif); font-style: italic; font-weight: 500; font-size: 42px; line-height: 1.05; margin: 18px 0 6px; color: #ffe9b8; text-shadow: 0 0 24px rgba(var(--c), 0.35); }
        .sub { color: var(--muted); font-size: 15px; line-height: 1.5; margin: 0 0 18px; }
        .label { color: var(--muted); font-size: 13px; margin: 20px 0 10px; letter-spacing: 0.02em; }

        .card { width: 100%; background: var(--glass); border: 1px solid var(--line); border-radius: 18px; padding: 14px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
        textarea { width: 100%; height: 118px; resize: none; border: 0; outline: 0; background: transparent; color: var(--text); font-family: var(--serif); font-style: italic; font-size: 22px; line-height: 1.35; padding: 2px 2px 0; }
        textarea::placeholder { color: var(--faint); }
        .card:focus-within { border-color: rgba(var(--c), 0.65); box-shadow: 0 0 0 3px rgba(var(--c), 0.12), 0 0 30px rgba(var(--c), 0.15); }
        .counter { text-align: right; font-size: 12px; color: var(--faint); }
        .counter.limit { color: var(--gold); }

        .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
        .chip { border: 1px solid var(--line); background: rgba(255, 255, 255, 0.04); color: #d9d4ea; border-radius: 999px; padding: 7px 14px; font-size: 14px; cursor: pointer; }
        .chip:active { transform: scale(0.96); }

        .colors { display: flex; gap: 14px; justify-content: center; }
        .color { width: 38px; height: 38px; border-radius: 50%; border: 0; cursor: pointer; background: radial-gradient(circle at 50% 45%, #fff 0 10%, rgb(var(--sw)) 38%, rgba(var(--sw), 0.55) 70%); box-shadow: 0 0 14px rgba(var(--sw), 0.45); transition: transform 0.2s; }
        .color[aria-checked="true"] { transform: scale(1.12); outline: 2px solid #fff; outline-offset: 3px; }

        .btn { width: 100%; border: 0; border-radius: 999px; padding: 15px 18px; font-size: 16px; font-weight: 600; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px; text-decoration: none; transition: transform 0.15s, filter 0.2s; }
        .btn:active { transform: scale(0.98); }
        .btn-gold { background: linear-gradient(180deg, #f7d58c, #e9b55a); color: var(--gold-ink); box-shadow: 0 6px 24px rgba(242, 196, 109, 0.28); }
        .btn-ghost { background: rgba(255, 255, 255, 0.05); color: #e4def5; border: 1px solid var(--line); }
        .btn-link { background: none; border: 0; color: var(--muted); font-size: 14px; padding: 10px; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
        .spacer { flex: 1; min-height: 18px; }
        #status { margin: 12px 0 0; min-height: 20px; font-size: 14px; color: var(--gold); }
        #status.error { color: #fca5a5; }
        .lang { margin-top: 14px; display: flex; gap: 4px; font-size: 13px; color: var(--faint); }
        .lang button { background: none; border: 0; color: var(--faint); padding: 6px 8px; cursor: pointer; font-size: 13px; }
        .lang button[aria-pressed="true"] { color: var(--text); font-weight: 600; }

        /* ----- Lanzar la estrella ----- */
        #launchView { min-height: calc(100dvh - 40px); }
        .stage { position: relative; width: 240px; height: 240px; display: flex; align-items: center; justify-content: center; margin: 10px 0 4px; }
        .ring { position: absolute; inset: 0; }
        .ring circle { fill: none; stroke-width: 2; }
        #star { width: 132px; height: 132px; border-radius: 50%; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; border: 0; padding: 0;
                background: radial-gradient(circle, #fff 0 7%, rgba(255, 252, 240, 0.95) 12%, rgb(var(--c)) 24%, rgba(var(--c), 0.45) 44%, rgba(var(--c), 0.12) 60%, rgba(var(--c), 0) 71%);
                animation: breathe 2.6s ease-in-out infinite; will-change: transform; }
        @keyframes breathe { 50% { transform: scale(1.07); filter: brightness(1.12); } }
        .charging #star { animation: heartbeat 0.85s ease-in-out infinite; }
        @keyframes heartbeat { 0%, 100% { transform: translateY(var(--lift, 0)) scale(var(--grow, 1)); } 15% { transform: translateY(var(--lift, 0)) scale(calc(var(--grow, 1) * 1.12)); } 30% { transform: translateY(var(--lift, 0)) scale(var(--grow, 1)); } 45% { transform: translateY(var(--lift, 0)) scale(calc(var(--grow, 1) * 1.08)); } }
        .flying #star { animation: none; transition: transform 0.75s cubic-bezier(0.3, 0.6, 0.2, 1), opacity 0.75s ease-in; transform: translateY(-115vh) scale(0.45); opacity: 0.3; }
        .nudge #star { animation: nudge 0.6s ease; }
        @keyframes nudge { 30% { transform: translateY(-26px); } 60% { transform: translateY(4px); } }
        #preview { font-family: var(--serif); font-style: italic; font-size: 22px; line-height: 1.35; color: #fff4dc; max-width: 340px; margin: 6px 0 0; text-shadow: 0 0 18px rgba(var(--c), 0.4); overflow-wrap: anywhere; }
        .hint { color: var(--muted); font-size: 15px; margin: 0; line-height: 1.5; }
        .hint strong { color: var(--text); font-weight: 600; }
        .chev { font-size: 22px; color: rgba(var(--c), 0.9); animation: float 1.6s ease-in-out infinite; line-height: 1; }
        @keyframes float { 50% { transform: translateY(-6px); opacity: 0.55; } }

        /* ----- Llegada y recuerdo ----- */
        .pill { display: inline-block; padding: 8px 14px; border-radius: 999px; border: 1px solid rgba(var(--c), 0.4); background: rgba(var(--c), 0.1); color: #ffe7b0; font-size: 14px; margin: 0 0 16px; }
        .pill.arrived { background: rgba(var(--c), 0.22); box-shadow: 0 0 24px rgba(var(--c), 0.35); }
        #souvenir { width: auto; max-width: 74%; max-height: 46vh; border-radius: 14px; border: 1px solid var(--line); box-shadow: 0 10px 40px rgba(0, 0, 0, 0.45); margin-bottom: 14px; display: none; }
        #saveHint { color: var(--gold); font-size: 14px; margin: 0 0 10px; display: none; }
        #sentNote { color: var(--muted); font-size: 13px; margin: 0 0 12px; }
        .row { display: flex; flex-direction: column; gap: 10px; width: 100%; }
        .insta { color: #c7d2fe; font-size: 14px; text-decoration: none; margin-top: 12px; display: inline-flex; align-items: center; gap: 6px; }

        /* ----- Cuenta regresiva colectiva ----- */
        #countdown { position: fixed; inset: 0; z-index: 20; display: none; align-items: center; justify-content: center; flex-direction: column; background: rgba(3, 3, 14, 0.82); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); text-align: center; }
        #countdown.show { display: flex; }
        #cdNum { font-family: var(--serif); font-style: italic; font-size: 140px; line-height: 1; color: #ffe9b8; text-shadow: 0 0 40px rgba(var(--c), 0.6); }
        #cdNum.pop { animation: pop 0.9s ease both; }
        @keyframes pop { from { transform: scale(1.5); opacity: 0; } 30% { opacity: 1; } to { transform: scale(1); } }
        #cdText { color: var(--muted); font-size: 16px; margin-top: 10px; }

        @media (prefers-reduced-motion: reduce) { #sky i, #star, .chev { animation: none !important; } }
        .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    </style>
</head>
<body>
    <div id="sky" aria-hidden="true"></div>

    <main>
        <!-- 1. Escribir y escoger color -->
        <section class="view active" id="writeView" aria-labelledby="t-title">
            <h1 id="t-title" data-i18n="title">Deja tu luz</h1>
            <p class="sub" data-i18n="subtitle">Escribe un mensaje de amor o de fe.</p>

            <div class="card">
                <label for="messageInput" class="sr-only" data-i18n="placeholder">Tu mensaje…</label>
                <textarea id="messageInput" maxlength="140" data-i18n-placeholder="placeholder" placeholder="Tu mensaje…"></textarea>
                <div class="counter" id="counter">0 / 140</div>
            </div>

            <p class="label" data-i18n="ideas">¿No sabes qué escribir?</p>
            <div class="chips" id="chips"></div>

            <p class="label" id="colorLabel" data-i18n="color">El color de tu luz</p>
            <div class="colors" id="colors" role="radiogroup" aria-labelledby="colorLabel"></div>

            <div class="spacer"></div>
            <p id="status" role="status"></p>
            <button class="btn btn-gold" id="continueButton" data-i18n="continue">Continuar</button>
            <div class="lang" role="group" aria-label="Idioma / Language">
                <button data-lang="es" aria-pressed="true">Español</button>·<button data-lang="en" aria-pressed="false">English</button>
            </div>
        </section>

        <!-- 2. Mantener y lanzar la estrella -->
        <section class="view" id="launchView" aria-labelledby="t-ready">
            <p class="sub" id="t-ready" style="margin-top:14px" data-i18n="ready">Tu luz está lista</p>
            <p id="preview"></p>
            <div class="spacer"></div>
            <div class="chev" aria-hidden="true">︿</div>
            <div class="stage" id="stage">
                <svg class="ring" viewBox="0 0 240 240" aria-hidden="true">
                    <circle cx="120" cy="120" r="104" stroke="rgba(255,255,255,0.08)"></circle>
                    <circle id="charge" cx="120" cy="120" r="104" stroke="rgb(var(--c))" stroke-linecap="round" stroke-dasharray="653.5" stroke-dashoffset="653.5" transform="rotate(-90 120 120)"></circle>
                </svg>
                <button id="star" data-i18n-aria="launch" aria-label="Lanzar mi luz"></button>
            </div>
            <p class="hint"><strong data-i18n="hold">Mantén presionada la estrella</strong><br><span data-i18n="swipe">y desliza hacia arriba para lanzarla</span></p>
            <div class="spacer"></div>
            <p id="launchStatus" class="hint" role="status" style="min-height:22px;color:var(--gold)"></p>
            <button class="btn btn-ghost" id="launchButton" data-i18n="launch">Lanzar mi luz</button>
            <button class="btn-link" id="editButton" data-i18n="edit">Editar mensaje</button>
        </section>

        <!-- 3. Llegada al muro y recuerdo -->
        <section class="view" id="doneView" aria-labelledby="t-done">
            <h1 id="t-done" data-i18n="onWay">Tu luz va en camino</h1>
            <p class="sub" id="doneSub"></p>
            <p class="pill" id="lightStatus" role="status"></p>
            <p id="sentNote"></p>
            <img id="souvenir" alt="">
            <p id="saveHint" data-i18n="holdToSave">Mantén presionada la imagen para guardarla</p>
            <div class="row">
                <button class="btn btn-gold" id="shareButton" data-i18n="share">Compartir en historia</button>
                <button class="btn btn-ghost" id="anotherButton" data-i18n="another">Mandar otra luz</button>
            </div>
            <a class="insta" href="https://www.instagram.com/ivanguaderramaart/" target="_blank" rel="noopener">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="2" width="20" height="20" rx="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg>
                <span data-i18n="follow">Síguenos en Instagram</span>
            </a>
        </section>
    </main>

    <!-- Cuenta regresiva que se ve al mismo tiempo en la pantalla grande y en todos los celulares -->
    <div id="countdown" role="alert" aria-live="assertive"><div id="cdNum"></div><div id="cdText"></div></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, doc, setDoc, onSnapshot, query, where, getCountFromServer, serverTimestamp, setLogLevel } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { firebaseConfig, MESSAGES_COLLECTION, HISTORY_COLLECTION, STATE_DOC, MAX_MESSAGE_CHARS, LIGHT_COLORS, DEFAULT_COLOR } from "./firebase-config.js";
        import { paintSky, heartX, heartY, ARCO_BOX, paintArco, drawWhale } from "./escena.js";

        const SEND_TIMEOUT_MS = 8000;        // Si el servidor no confirma en este tiempo, se avisa en vez de quedarse esperando
        const WATCH_MAX_MS = 20 * 60 * 1000; // Se deja de seguir la luz después de 20 minutos
        const FULL_CHARGE_MS = 1500;         // Lo que tarda la estrella en cargarse al máximo al mantenerla presionada
        const SWIPE_PX = 70;                 // Cuánto hay que deslizar hacia arriba para lanzarla
        const SERIF = '"Cormorant Garamond", Georgia, serif';
        const SANS = '-apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif';

        // ================= Textos en español e inglés =================
        const TEXTS = {
            es: {
                title: 'Deja tu luz', subtitle: 'Escribe un mensaje de amor o de fe.', placeholder: 'Tu mensaje…',
                ideas: '¿No sabes qué escribir?', color: 'El color de tu luz', continue: 'Continuar',
                chips: ['Gracias', 'Te amo', 'Fe', 'Esperanza', 'Paz', 'Bendiciones'],
                empty: 'Escribe tu mensaje primero.', connecting: 'Conectando… intenta en un momento.', offline: 'No hay internet. Intenta de nuevo.',
                retry: (s) => `Sin conexión, reintentando en ${s} s…`,
                ready: 'Tu luz está lista', hold: 'Mantén presionada la estrella', swipe: 'y desliza hacia arriba para lanzarla',
                launch: 'Lanzar mi luz', edit: 'Editar mensaje', nudge: 'Desliza hacia arriba ↑', launching: 'Lanzando…',
                error: 'No se pudo enviar. Intenta de nuevo.',
                onWay: 'Tu luz va en camino', onWayPill: 'Viajando al muro…',
                ahead: (n) => n === 0 ? 'Mira la pantalla: ya casi llega' : n === 1 ? 'Hay 1 luz antes que la tuya' : `Hay ${n} luces antes que la tuya`,
                arrived: 'Tu luz ya está en el muro', arrivedPill: '✦ Búscala en la pantalla',
                number: (n) => `Eres la luz número ${n} de esta noche`,
                slow: 'Tu conexión está lenta: tu luz aparecerá en el muro en cuanto se conecte.',
                share: 'Compartir en historia', download: 'Descargar imagen', preparing: 'Preparando tu recuerdo…', holdToSave: 'Mantén presionada la imagen para guardarla',
                another: 'Mandar otra luz', follow: 'Síguenos en Instagram',
                cdReady: 'Prepara tu luz…', cdGo: '¡Lanza tu luz!', cdGoText: 'Todos al mismo tiempo',
                souvenirLight: (n) => `Luz nº ${n}`, souvenirAlt: 'Tu recuerdo del Mural de Luz', shareText: 'Dejé mi luz en el Mural de Luz ✦'
            },
            en: {
                title: 'Leave your light', subtitle: 'Write a message of love or faith.', placeholder: 'Your message…',
                ideas: 'Not sure what to write?', color: 'The color of your light', continue: 'Continue',
                chips: ['Thank you', 'I love you', 'Faith', 'Hope', 'Peace', 'Blessings'],
                empty: 'Write your message first.', connecting: 'Connecting… try again in a moment.', offline: 'No internet connection. Try again.',
                retry: (s) => `No connection, retrying in ${s} s…`,
                ready: 'Your light is ready', hold: 'Press and hold the star', swipe: 'then swipe up to launch it',
                launch: 'Launch my light', edit: 'Edit message', nudge: 'Swipe up ↑', launching: 'Launching…',
                error: "Couldn't send it. Try again.",
                onWay: 'Your light is on its way', onWayPill: 'Traveling to the wall…',
                ahead: (n) => n === 0 ? 'Watch the screen: it’s almost there' : n === 1 ? '1 light ahead of yours' : `${n} lights ahead of yours`,
                arrived: 'Your light is on the wall', arrivedPill: '✦ Find it on the screen',
                number: (n) => `You are light number ${n} tonight`,
                slow: 'Your connection is slow: your light will appear on the wall as soon as it reconnects.',
                share: 'Share to your story', download: 'Download image', preparing: 'Preparing your souvenir…', holdToSave: 'Press and hold the image to save it',
                another: 'Send another light', follow: 'Follow us on Instagram',
                cdReady: 'Get your light ready…', cdGo: 'Launch your light!', cdGoText: 'Everyone at once',
                souvenirLight: (n) => `Light no. ${n}`, souvenirAlt: 'Your Mural de Luz souvenir', shareText: 'I left my light at the Mural de Luz ✦'
            }
        };
        let lang = (() => {
            try { const saved = localStorage.getItem('mural-lang'); if (saved === 'es' || saved === 'en') return saved; } catch {}
            return (navigator.language || 'es').toLowerCase().startsWith('es') ? 'es' : 'en';
        })();
        const T = () => TEXTS[lang];

        // ================= Elementos =================
        const $ = (id) => document.getElementById(id);
        const views = { write: $('writeView'), launch: $('launchView'), done: $('doneView') };
        const messageInput = $('messageInput'), counter = $('counter'), statusEl = $('status');
        const star = $('star'), stage = $('stage'), charge = $('charge'), preview = $('preview'), launchStatus = $('launchStatus');
        const lightStatus = $('lightStatus'), doneTitle = $('t-done'), doneSub = $('doneSub'), sentNote = $('sentNote');
        const souvenirImg = $('souvenir'), saveHint = $('saveHint'), shareButton = $('shareButton');
        const isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && /Mac/.test(navigator.userAgent));
        const canVibrate = typeof navigator.vibrate === 'function';
        const vibrate = (pattern) => { if (canVibrate) try { navigator.vibrate(pattern); } catch {} };

        let colorId = DEFAULT_COLOR;
        let currentText = '';
        let souvenirBlob = null;
        let lightNumber = null;
        let nightStart = null;       // Cuándo empezó la noche (lo decide la pantalla grande)

        function showView(name) {
            Object.entries(views).forEach(([key, el]) => el.classList.toggle('active', key === name));
            window.scrollTo(0, 0);
        }
        function setStatus(text, isError = false) { statusEl.textContent = text; statusEl.classList.toggle('error', isError); }

        // ================= Cielo de fondo (se dibuja una vez; el titilar lo hace el navegador, casi sin gastar batería) =================
        (function buildSky() {
            const sky = $('sky');
            const frag = document.createDocumentFragment();
            for (let i = 0; i < 90; i++) {
                const s = document.createElement('i');
                const size = Math.random() < 0.15 ? 2.2 : Math.random() * 1.4 + 0.6;
                s.style.cssText = `left:${Math.random() * 100}%;top:${Math.random() * 100}%;width:${size}px;height:${size}px;opacity:${(0.25 + Math.random() * 0.6).toFixed(2)};--d:${(2.5 + Math.random() * 4).toFixed(1)}s;--delay:-${(Math.random() * 6).toFixed(1)}s`;
                frag.appendChild(s);
            }
            sky.appendChild(frag);
        })();

        // ================= Idioma =================
        function applyLanguage() {
            document.documentElement.lang = lang;
            document.querySelectorAll('[data-i18n]').forEach(el => { const v = T()[el.dataset.i18n]; if (typeof v === 'string') el.textContent = v; });
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => { el.placeholder = T()[el.dataset.i18nPlaceholder]; });
            document.querySelectorAll('[data-i18n-aria]').forEach(el => { el.setAttribute('aria-label', T()[el.dataset.i18nAria]); });
            document.querySelectorAll('.lang button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
            souvenirImg.alt = T().souvenirAlt;
            renderChips(); renderColors();
            updateShareLabel();
        }
        document.querySelectorAll('.lang button').forEach(b => b.addEventListener('click', () => {
            lang = b.dataset.lang;
            try { localStorage.setItem('mural-lang', lang); } catch {}
            applyLanguage();
        }));

        // ================= Ideas para escribir y color de la luz =================
        function renderChips() {
            const box = $('chips'); box.textContent = '';
            T().chips.forEach(word => {
                const b = document.createElement('button');
                b.className = 'chip'; b.type = 'button'; b.textContent = word;
                b.addEventListener('click', () => {
                    const cur = messageInput.value.trim();
                    const next = cur ? `${cur} ${word}` : word;
                    if (next.length <= MAX_MESSAGE_CHARS) { messageInput.value = next; updateCounter(); }
                    messageInput.focus();
                });
                box.appendChild(b);
            });
        }
        function renderColors() {
            const box = $('colors'); box.textContent = '';
            Object.entries(LIGHT_COLORS).forEach(([id, c]) => {
                const b = document.createElement('button');
                b.className = 'color'; b.type = 'button';
                b.setAttribute('role', 'radio'); b.setAttribute('aria-checked', String(id === colorId)); b.setAttribute('aria-label', c.name[lang]);
                b.style.setProperty('--sw', c.rgb.join(', '));
                b.addEventListener('click', () => { setColor(id); vibrate(8); });
                box.appendChild(b);
            });
        }
        function setColor(id) {
            colorId = LIGHT_COLORS[id] ? id : DEFAULT_COLOR;
            document.documentElement.style.setProperty('--c', LIGHT_COLORS[colorId].rgb.join(', '));
            document.querySelectorAll('.color').forEach((b, i) => b.setAttribute('aria-checked', String(Object.keys(LIGHT_COLORS)[i] === colorId)));
        }

        function updateCounter() {
            const n = messageInput.value.length;
            counter.textContent = `${n} / ${MAX_MESSAGE_CHARS}`;
            counter.classList.toggle('limit', n >= MAX_MESSAGE_CHARS);
            if (n) setStatus('');
        }
        messageInput.addEventListener('input', updateCounter);

        // ================= Firebase =================
        let db = null; let messagesRef = null; let historyRef = null; let auth = null;
        async function initializeFirebase(attempt = 1) {
            try {
                if (!db) {
                    const app = initializeApp(firebaseConfig);
                    db = getFirestore(app); auth = getAuth(app);
                    setLogLevel('error');
                    messagesRef = collection(db, MESSAGES_COLLECTION);
                    historyRef = collection(db, HISTORY_COLLECTION);
                    listenNight();
                }
                await signInAnonymously(auth);
                if (statusEl.classList.contains('error')) setStatus('');
            } catch (error) {
                console.error('Firebase initialization error:', error);

                setStatus(T().retry(wait), true);
                setTimeout(() => initializeFirebase(attempt + 1), wait * 1000);

        }

        // La pantalla grande guarda cuándo empezó la noche y cuándo lanza la cuenta regresiva
        let lastCountdown = null; let lastCountdownShown = -Infinity;

        function listenNight() {
            onSnapshot(doc(db, ...STATE_DOC), { includeMetadataChanges: true }, (snap) => {
                if (snap.metadata.fromCache) return; // Sin internet la copia guardada puede ser vieja: solo cuenta lo que confirma el servidor
                const data = snap.data() || {};
                if (isTimestamp(data.startedAt)) nightStart = data.startedAt;
                const cd = isTimestamp(data.countdownAt) ? data.countdownAt.toMillis() : null;
                // Solo una cuenta nueva y reciente (no una vieja que ya pasó antes de abrir la página), y no más de una por minuto
                const isNew = cd && (lastCountdown === null || Math.abs(cd - lastCountdown) > 30 * 1000);
                if (isNew && Math.abs(Date.now() - cd) < 15 * 1000 && performance.now() - lastCountdownShown > 60 * 1000) {

        // ================= Paso 1 → 2 =================
        $('continueButton').addEventListener('click', () => {
            const text = messageInput.value.replace(/\s+/g, ' ').trim().slice(0, MAX_MESSAGE_CHARS);
            if (!text) { setStatus(T().empty); messageInput.focus(); return; }
            currentText = text;
            preview.textContent = `“${text}”`;
            resetStar();
            launchStatus.textContent = '';
            showView('launch');
        });
        $('editButton').addEventListener('click', () => { if (!launched) showView('write'); });

        // ================= Mantener y lanzar la estrella =================
        let holdStart = 0; let startY = 0; let lastY = 0; let lastT = 0; let velocity = 0; let holding = false; let power = 0;
        let chargeFrame = 0; let beatTimer = null; let launched = false; let activePointer = null;

        function resetStar() {
            launched = false; holding = false; power = 0; activePointer = null;
            stage.classList.remove('charging', 'flying', 'nudge');
            star.style.removeProperty('--lift'); star.style.removeProperty('--grow'); star.style.transform = '';
            charge.style.strokeDashoffset = '653.5';
            clearInterval(beatTimer); cancelAnimationFrame(chargeFrame);
        }

        function chargeLoop() {
            if (!holding) return;
            power = Math.min(1, (performance.now() - holdStart) / FULL_CHARGE_MS);
            charge.style.strokeDashoffset = String(653.5 * (1 - power));
            star.style.setProperty('--grow', (1 + power * 0.22).toFixed(3));
            chargeFrame = requestAnimationFrame(chargeLoop);
        }

        star.addEventListener('pointerdown', (e) => {
            if (launched || holding) return; // Un segundo dedo no hace nada
            e.preventDefault();

            try { star.setPointerCapture(e.pointerId); } catch {}
            holding = true; holdStart = performance.now();
            startY = lastY = e.clientY; lastT = holdStart; velocity = 0;
            stage.classList.add('charging'); stage.classList.remove('nudge');

        });

            const dy = Math.min(0, e.clientY - startY);

        });
        function stopCharging() {
            holding = false; activePointer = null;
            clearInterval(beatTimer); cancelAnimationFrame(chargeFrame);
        }
        function endHold(e) {

            launchStatus.textContent = T().nudge;
        }
        star.addEventListener('pointerup', endHold);
        // Si el sistema interrumpe (notificaciones, llamada, cambiar de app), la estrella solo regresa: nunca se manda por accidente
        star.addEventListener('pointercancel', (e) => {

        document.addEventListener('visibilitychange', () => { if (document.hidden && holding) { stopCharging(); stage.classList.remove('charging'); star.style.removeProperty('--lift'); } });
        star.addEventListener('contextmenu', (e) => e.preventDefault());
        // Para quien prefiere un botón (o usa lector de pantalla)
        $('launchButton').addEventListener('click', () => { if (!launched) { power = Math.max(power, 0.5); launchStar(); } });
        star.addEventListener('keydown', (e) => { if ((e.key === 'Enter' || e.key === ' ') && !launched) { e.preventDefault(); power = Math.max(power, 0.5); launchStar(); } });

        function launchStar() {
            if (launched) return;
            launched = true;
            stopCharging();
            vibrate(40);
            stage.classList.remove('charging', 'nudge');
            stage.classList.add('flying');
            launchStatus.textContent = T().launching;
            sendLight(currentText, colorId, Math.round(Math.max(0.3, power) * 100) / 100);
        }

        // ================= Enviar =================
        async function sendLight(text, color, strength) {
            if (!messagesRef) { launchFailed(T().connecting); return; }
            if (navigator.onLine === false) { launchFailed(T().offline); return; }
            try {
                // Firestore guarda el mensaje aunque la señal sea mala; si no confirma rápido, se avisa en vez de esperar para siempre
                const ref = doc(messagesRef);
                const sent = setDoc(ref, { text, color, power: strength, createdAt: serverTimestamp(), t: Date.now() });
                sent.catch((error) => console.error('Error sending message:', error));
                watchMyLight(ref, sent);
                const delivered = await Promise.race([sent.then(() => true), new Promise(resolve => setTimeout(() => resolve(false), SEND_TIMEOUT_MS))]);
                await new Promise(r => setTimeout(r, 500)); // Que se alcance a ver cómo se va la estrella
                showDone(delivered);
                makeSouvenir();
            } catch (error) {
                console.error('Error sending message:', error);
                launchFailed(T().error);
            }
        }
        function launchFailed(text) {
            resetStar();
            launchStatus.textContent = text;
        }

        function showDone(delivered) {
            lightNumber = null; souvenirBlob = null; updateShareLabel();
            doneTitle.textContent = T().onWay;
            doneSub.textContent = '';
            souvenirImg.style.display = 'none'; saveHint.style.display = 'none';
            sentNote.textContent = delivered ? '' : T().slow;
            showView('done');
        }

        function setLightStatus(text, arrived = false) {
            lightStatus.textContent = text;
            lightStatus.classList.toggle('arrived', arrived);
        }

        // Le dice a la persona cuántas luces van antes que la suya, y le avisa cuando ya salió en la pantalla
        // (la pantalla borra cada mensaje de la fila justo cuando lo muestra, y lo guarda en el respaldo)
        let stopWatching = () => {};
        function watchMyLight(ref, sent) {
            stopWatching();
            let confirmed = false; let stopped = false; let created = null;
            let timer = null; let unsubscribe = () => {};
            const stop = () => { stopped = true; unsubscribe(); clearTimeout(timer); };
            stopWatching = stop;
            const markArrived = () => {
                if (stopped) return;
                stop();
                vibrate([30, 60, 30, 60, 60]);
                doneTitle.textContent = T().arrived;
                setLightStatus(T().arrivedPill, true);
                findLightNumber(created);
            };
            setLightStatus(T().onWayPill);
            unsubscribe = onSnapshot(ref, { includeMetadataChanges: true }, (snap) => {
                if (!snap.exists()) {
                    // Solo se avisa si de verdad se guardó (si el envío falló, no se dice nada falso).
                    // Con señal lenta puede desaparecer antes de verse confirmado: entonces se espera la confirmación del envío
                    if (confirmed) markArrived(); else sent.then(markArrived, () => {});
                    return;
                }
                if (confirmed || snap.metadata.hasPendingWrites || snap.metadata.fromCache) return;
                created = snap.get('createdAt');
                if (!created) return;
                confirmed = true;
                getCountFromServer(query(messagesRef, where('createdAt', '<', created)))
                    .then((result) => { if (!stopped) setLightStatus(T().ahead(result.data().count)); })
                    .catch((error) => console.warn('Could not count the lights ahead:', error));
            }, (error) => { console.warn('Could not follow the light:', error); stop(); });
            timer = setTimeout(stop, WATCH_MAX_MS);
        }

        // "Eres la luz número N de esta noche": se cuentan las luces del respaldo desde que empezó la noche hasta la suya
        async function findLightNumber(created) {
            if (!created || !historyRef) return;
            try {
                const filters = [where('createdAt', '<=', created)];
                if (nightStart) filters.unshift(where('createdAt', '>=', nightStart));
                const result = await getCountFromServer(query(historyRef, ...filters));
                lightNumber = result.data().count;
                if (lightNumber > 0) { doneSub.textContent = T().number(lightNumber); makeSouvenir(); }
            } catch (error) { console.warn('Could not find the light number:', error); }
        }

        // ================= Recuerdo tamaño historia (1080 × 1920) =================
        // Es la misma escena de la pantalla grande: cielo con Vía Láctea, el corazón de luces con el cometa y la luz de la persona
        // en su color, y abajo el mar de Los Cabos con El Arco y la ballena con su ballenato
        const fontsReady = Promise.all([document.fonts.load(`italic 500 64px ${SERIF}`), document.fonts.load(`italic 600 64px ${SERIF}`)]).catch(() => {});

        function wrapText(ctx, text, maxWidth) {
            const lines = []; let line = '';
            for (let word of text.split(' ')) {
                let chars = Array.from(word);
                while (chars.length > 1 && ctx.measureText(word).width > maxWidth) {
                    let cut = chars.length - 1;
                    while (cut > 1 && ctx.measureText(chars.slice(0, cut).join('')).width > maxWidth) cut--;
                    if (line) { lines.push(line); line = ''; }
                    lines.push(chars.slice(0, cut).join(''));
                    chars = chars.slice(cut); word = chars.join('');
                }
                const test = line ? `${line} ${word}` : word;
                if (line && ctx.measureText(test).width > maxWidth) { lines.push(line); line = word; } else line = test;
            }
            if (line) lines.push(line);
            return lines;
        }

        // Brillo redondo pre-dibujado (como las luces de la pantalla)
        function glowSprite(rgb, core = 1, edge = 0.4) {
            const g = document.createElement('canvas'); g.width = g.height = 64;
            const x = g.getContext('2d');
            const grad = x.createRadialGradient(32, 32, 0, 32, 32, 32);
            grad.addColorStop(0, `rgba(${rgb}, ${core})`); grad.addColorStop(0.3, `rgba(${rgb}, ${core * 0.85})`);
            grad.addColorStop(0.42, `rgba(${rgb}, ${edge})`); grad.addColorStop(1, `rgba(${rgb}, 0)`);
            x.fillStyle = grad; x.fillRect(0, 0, 64, 64);
            return g;
        }

        // La escena se pinta una sola vez por mensaje (es lo pesado); cuando llega el número de luz solo se vuelve a poner la firma
        let souvenirBase = null; // { key, canvas }
        function paintSouvenirScene(text, rgb) {
            const W = 1080, H = 1920, HY = 1460;              // HY: el horizonte del mar
            const canvas = document.createElement('canvas'); canvas.width = W; canvas.height = H;
            const c = canvas.getContext('2d');
            const rr = (a, b) => a + Math.random() * (b - a);
            const col = rgb.join(', ');
            // 1) Cielo
            paintSky(c, W, H, HY);
            // 2) Corazón de luces, con su punta tocando el mar
            const k = 25, cx = W / 2, cy = HY - 14.5 * 1.1 * k - 16;
            const whites = [glowSprite('255, 255, 255', 0.9, 0.35), glowSprite('200, 220, 255', 0.9, 0.35), glowSprite('255, 248, 205', 0.9, 0.35)];
            const others = Object.values(LIGHT_COLORS).map(({ rgb: o }) => glowSprite(o.join(', '), 1, 0.5));
            const dots = [];
            for (let i = 0; i < 1250; i++) {
                const t = rr(0, Math.PI * 2), a = rr(0, Math.PI * 2), d = rr(0, 22) * Math.sqrt(Math.random());
                const x = cx + heartX(t) * k + Math.cos(a) * d, y = cy + heartY(t) * k * 1.1 + Math.sin(a) * d;
                const colored = Math.random() < 0.06; // Otras luces de la gente, de colores
                const size = colored ? rr(11, 16) : rr(4, 11);
                dots.push({ x, y, size, sprite: colored ? others[Math.floor(Math.random() * others.length)] : whites[Math.floor(Math.random() * 3)], colored });
            }
            // Constelación: líneas finas entre las luces de colores cercanas
            const coloredDots = dots.filter(d => d.colored);
            c.strokeStyle = 'rgba(255, 236, 200, 0.2)'; c.lineWidth = 1.2; c.beginPath();
            for (const d of coloredDots) {
                const near = coloredDots.filter(o => o !== d).map(o => [o, (o.x - d.x) ** 2 + (o.y - d.y) ** 2]).filter(([, d2]) => d2 < 170 * 170).sort((a, b) => a[1] - b[1]).slice(0, 2);
                for (const [o] of near) { c.moveTo(d.x, d.y); c.lineTo(o.x, o.y); }
            }
            c.stroke();
            for (const d of dots) c.drawImage(d.sprite, d.x - d.size, d.y - d.size, d.size * 2, d.size * 2);
            // 3) El cometa de la persona llegando a su luz, en su color
            const lt = 1.6; const lx = cx + heartX(lt) * k, ly = cy + heartY(lt) * k * 1.1;
            const trail = glowSprite(col, 1, 0.5); const white = glowSprite('255, 255, 245', 1, 0.6);
            const p0 = [90, 600], p1 = [420, 560];
            for (let i = 0; i <= 70; i++) {
                const t = i / 70, u = 1 - t;
                const x = u * u * p0[0] + 2 * u * t * p1[0] + t * t * lx, y = u * u * p0[1] + 2 * u * t * p1[1] + t * t * ly;
                const size = 4 + t * 22;
                c.globalAlpha = 0.08 + t * 0.55;
                c.drawImage(trail, x - size, y - size, size * 2, size * 2);
            }
            c.globalAlpha = 1;
            // Su luz en el corazón: halo de su color, centro blanco, un anillo y destellos en cruz
            c.drawImage(trail, lx - 80, ly - 80, 160, 160);
            c.drawImage(white, lx - 22, ly - 22, 44, 44);
            c.strokeStyle = `rgba(${col}, 0.45)`; c.lineWidth = 2; c.beginPath(); c.arc(lx, ly, 46, 0, Math.PI * 2); c.stroke();
            for (const [dx, dy, l] of [[1, 0, 70], [0, 1, 70], [0.7, 0.7, 34], [0.7, -0.7, 34]]) {
                const g = c.createLinearGradient(lx - dx * l, ly - dy * l, lx + dx * l, ly + dy * l);
                g.addColorStop(0, 'rgba(255, 255, 255, 0)'); g.addColorStop(0.5, 'rgba(255, 255, 255, 0.9)'); g.addColorStop(1, 'rgba(255, 255, 255, 0)');
                c.strokeStyle = g; c.lineWidth = 2; c.beginPath(); c.moveTo(lx - dx * l, ly - dy * l); c.lineTo(lx + dx * l, ly + dy * l); c.stroke();
            }
            // 4) El mar
            const sea = c.createLinearGradient(0, HY, 0, H);
            sea.addColorStop(0, '#0c0c2c'); sea.addColorStop(1, '#020210');
            c.fillStyle = sea; c.fillRect(0, HY, W, H - HY);
            // Reflejo de la punta del corazón, temblando
            for (const d of dots) {
                const dist = HY - d.y;
                if (dist < 0 || dist > 170) continue;
                c.globalAlpha = 0.32 * (1 - dist / 170);
                const wob = Math.sin(dist * 0.09) * (2 + dist * 0.04);
                c.drawImage(d.sprite, d.x + wob - d.size, HY + dist * 0.9 - d.size, d.size * 2, d.size * 2);
            }
            c.globalAlpha = 1;
            // 5) El Arco a la derecha, con su reflejo ondulado
            const ak = 0.44, aw = ARCO_BOX.w * ak, ah = (ARCO_BOX.sea - ARCO_BOX.top) * ak;
            const ax = W - aw, ay = HY - ah + 3;
            const arco = document.createElement('canvas'); arco.width = Math.ceil(aw) + 4; arco.height = Math.ceil(ah) + 6;
            paintArco(arco.getContext('2d'), ak, 2, 2, ah);
            const refl = document.createElement('canvas'); refl.width = arco.width; refl.height = arco.height;
            const r = refl.getContext('2d');
            r.setTransform(1, 0, 0, -1, 0, refl.height); r.drawImage(arco, 0, 0); r.setTransform(1, 0, 0, 1, 0, 0);
            r.globalCompositeOperation = 'destination-in';
            const fade = r.createLinearGradient(0, 0, 0, refl.height);
            fade.addColorStop(0, 'rgba(0, 0, 0, 0.55)'); fade.addColorStop(1, 'rgba(0, 0, 0, 0)');
            r.fillStyle = fade; r.fillRect(0, 0, refl.width, refl.height);
            for (let y = 0; y < refl.height; y += 6) c.drawImage(refl, 0, y, refl.width, 6, ax - 2 + Math.sin(y * 0.18) * (1 + y * 0.03), HY + y, refl.width, 6);
            c.drawImage(arco, ax - 2, ay - 2);
            // 6) La ballena y su ballenato nadando
            const ws = 0.8, wx = 300, wy = 1690;
            drawWhale(c, wx + 64 * ws, wy - 36 * ws, ws * 0.45, 1, 2.2, 0.9);
            drawWhale(c, wx, wy, ws, 1, 0.8, 1);
            // Olas y la línea del horizonte
            c.lineWidth = 1.5;
            for (let i = 0; i < 5; i++) {
                const y = HY + 40 + i * 85; c.beginPath();
                for (let x = 0; x <= W; x += 20) { const yy = y + Math.sin(x * 0.012 + i * 1.7) * (3 + i); x ? c.lineTo(x, yy) : c.moveTo(x, yy); }
                c.strokeStyle = `rgba(180, 190, 255, ${(0.08 - i * 0.01).toFixed(2)})`; c.stroke();
            }
            c.fillStyle = 'rgba(190, 180, 255, 0.18)'; c.fillRect(0, HY, W, 2);
            // 7) El mensaje arriba, grande y con brillo de su color (más pequeño si es largo)
            c.textAlign = 'center'; c.textBaseline = 'middle';
            c.fillStyle = 'rgba(255, 233, 184, 0.92)'; c.font = `italic 600 44px ${SERIF}`;
            c.fillText('Mural de Luz · Los Cabos', W / 2, 250);
            const chars = Array.from(text).length;
            const size = chars <= 40 ? 80 : chars <= 85 ? 66 : 56;
            c.font = `italic 500 ${size}px ${SERIF}`;
            const lines = wrapText(c, `“${text}”`, 900).slice(0, 6);
            const lh = size * 1.22; const top = 470 - ((lines.length - 1) * lh) / 2;
            c.shadowColor = `rgba(${col}, 0.75)`; c.shadowBlur = 30; c.fillStyle = '#fff6e0';
            lines.forEach((l, i) => c.fillText(l, W / 2, top + i * lh));
            c.shadowBlur = 0;
            return canvas;
        }

        let souvenirJob = 0;
        async function makeSouvenir() {
            const job = ++souvenirJob;
            const text = currentText; const rgb = LIGHT_COLORS[colorId].rgb; const number = lightNumber;
            await fontsReady;
            if (job !== souvenirJob) return;
            const key = `${text}|${colorId}`;
            if (!souvenirBase || souvenirBase.key !== key) souvenirBase = { key, canvas: paintSouvenirScene(text, rgb) };
            const W = 1080, H = 1920;
            const canvas = document.createElement('canvas'); canvas.width = W; canvas.height = H;
            const c = canvas.getContext('2d');
            c.drawImage(souvenirBase.canvas, 0, 0);
            // Firma: número de luz y fecha, y la galería
            c.textAlign = 'center'; c.textBaseline = 'middle';
            const date = new Date().toLocaleDateString(lang === 'es' ? 'es-MX' : 'en-US', { day: 'numeric', month: 'long', year: 'numeric' });
            c.shadowColor = 'rgba(0, 0, 0, 0.6)'; c.shadowBlur = 12;
            c.fillStyle = '#ffe9b8'; c.font = `italic 500 46px ${SERIF}`;
            c.fillText(number ? `${T().souvenirLight(number)} · ${date}` : date, W / 2, 1545);
            c.fillStyle = 'rgba(245, 241, 230, 0.85)'; c.font = `400 28px ${SANS}`;
            c.fillText('Iván Guaderrama Gallery · @ivanguaderramaart', W / 2, 1600);
            c.shadowBlur = 0;

            const url = canvas.toDataURL('image/png');
            if (job !== souvenirJob) return;
            souvenirImg.src = url; souvenirImg.style.display = 'block';
            saveHint.style.display = isMobile && !canShareFiles() ? 'block' : 'none';
            canvas.toBlob((blob) => { if (job === souvenirJob && blob) { souvenirBlob = blob; updateShareLabel(); } }, 'image/png');
        }

        function canShareFiles() {
            try { return !!(navigator.canShare && navigator.canShare({ files: [new File([new Blob()], 'x.png', { type: 'image/png' })] })); } catch { return false; }
        }
        function updateShareLabel() {
            shareButton.textContent = !souvenirBlob ? T().preparing : canShareFiles() ? T().share : T().download;
            shareButton.style.opacity = souvenirBlob ? '1' : '0.6';
        }

        shareButton.addEventListener('click', async () => {
            if (!souvenirBlob) return;
            const file = new File([souvenirBlob], 'mi-luz-mural-de-luz.png', { type: 'image/png' });
            if (canShareFiles()) {
                // Abre el menú del celular para mandarlo directo a Instagram, WhatsApp, etc.
                try { await navigator.share({ files: [file], title: 'Mural de Luz', text: T().shareText }); } catch (error) { if (error.name !== 'AbortError') console.warn('Share failed:', error); }
                return;
            }
            const a = document.createElement('a');
            a.href = URL.createObjectURL(souvenirBlob); a.download = file.name;
            document.body.appendChild(a); a.click(); a.remove();
            setTimeout(() => URL.revokeObjectURL(a.href), 4000);
        });

        $('anotherButton').addEventListener('click', () => {
            stopWatching(); souvenirJob++;
            messageInput.value = ''; updateCounter(); setStatus('');
            resetStar();
            showView('write');
        });

        // ================= Cuenta regresiva colectiva =================
        let countdownTimers = [];
        function startCountdown() {
            countdownTimers.forEach(clearTimeout); countdownTimers = [];
            const box = $('countdown'), num = $('cdNum'), txt = $('cdText');
            const show = (n, t) => { num.textContent = n; txt.textContent = t; num.classList.remove('pop'); void num.offsetWidth; num.classList.add('pop'); };
            box.classList.add('show');
            show('3', T().cdReady); vibrate(30);
            countdownTimers.push(setTimeout(() => { show('2', T().cdReady); vibrate(30); }, 1000));
            countdownTimers.push(setTimeout(() => { show('1', T().cdReady); vibrate(30); }, 2000));
            countdownTimers.push(setTimeout(() => { show('✦', `${T().cdGo} ${T().cdGoText}`); vibrate([60, 40, 60]); }, 3000));
            countdownTimers.push(setTimeout(() => box.classList.remove('show'), 3900));
        }
        $('countdown').addEventListener('click', () => $('countdown').classList.remove('show'));

        // Herramienta de prueba (?debug): genera el recuerdo sin mandar ningún mensaje al mural
        if (new URLSearchParams(location.search).has('debug')) {
            window.controlDebug = { souvenir: (text, color = DEFAULT_COLOR, number = null) => { currentText = text; setColor(color); lightNumber = number; showView('done'); return makeSouvenir(); } };
        }

        // ================= Inicio =================
        applyLanguage();
        setColor(colorId);
        initializeFirebase();
    </script>
</body>
</html>
